appId: com.openleash.personal
productName: Leash
artifactName: Leash-${version}-${arch}.${ext}
copyright: Copyright © 2026 Leash
electronVersion: 43.3.0
npmRebuild: false
forceCodeSigning: false
protocols:
  - name: OpenLeash authentication callback
    schemes:
      - openleash
extraMetadata:
  main: apps/desktop/dist/main.js
directories:
  output: release/personal
files:
  - apps/desktop/dist/**/*
  - from: apps/desktop/node_modules/@openleash/shared
    to: node_modules/@openleash/shared
    filter:
      - "**/*"
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/build/Release/*.node
  - apps/desktop/dist/openleash-island
  - apps/desktop/dist/notice.html
  - apps/desktop/dist/openleash-icon.png
  - apps/desktop/dist/Fireworks.json
  - apps/desktop/dist/lottie.min.js
  - apps/desktop/dist/agent-icons/**/*
  - apps/desktop/dist/agent-mascots/**/*
extraResources:
  - from: scripts/install-openleash-personal.sh
    to: install-openleash-personal.sh
  - from: apps/desktop/build/local-proxy
    to: local-proxy
mac:
  identity: null
  icon: apps/desktop/src/openleash-icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: true
  notarize: false
  entitlements: apps/desktop/build/entitlements.mac.plist
  entitlementsInherit: apps/desktop/build/entitlements.mac.inherit.plist
win:
  icon: apps/desktop/src/openleash-icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: Leash-${version}-${arch}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
dmg:
  title: Leash
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
