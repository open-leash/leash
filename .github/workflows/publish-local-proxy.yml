name: Publish Leash local proxy container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish
        required: true
        default: 0.36.4
  push:
    tags:
      - "local-proxy-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: mnns
          # This package predates the repository and cannot inherit its
          # GITHUB_TOKEN permissions, so use the scoped package PAT.
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#local-proxy-v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse mutable release tags
        shell: bash
        run: |
          image="ghcr.io/open-leash/local-proxy:${{ steps.version.outputs.value }}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Release tag already exists and is immutable: $image" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: apps/local-proxy
          file: apps/local-proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/open-leash/local-proxy:${{ steps.version.outputs.value }}
