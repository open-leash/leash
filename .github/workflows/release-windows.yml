name: Release Leash for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout Leash monorepo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install monorepo dependencies
        shell: pwsh
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./apps/desktop/package.json').version"
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match desktop package v$packageVersion"
          }

      - name: Test and build
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build -w @openleash/shared
          npm run typecheck -w @openleash/desktop-client
          npm run test -w @openleash/desktop-client
          npm run build -w @openleash/desktop-client

      - name: Require production Windows signing credentials
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw "WINDOWS_CSC_LINK is required; stable Windows releases must be Authenticode signed"
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "WINDOWS_CSC_KEY_PASSWORD is required; stable Windows releases must be Authenticode signed"
          }

      - name: Rebuild native dependency and package signed NSIS installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npx electron-rebuild -v 43.3.0 -w better-sqlite3 --force
          npx electron-builder --config electron-builder.windows.yml --win --x64 --publish never
          node scripts/verify-packaged-windows.mjs
          Get-ChildItem release/windows/*.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed for $($_.Name): $($signature.Status)"
            }
          }

      - name: Create checksums
        working-directory: apps/desktop/release/windows
        shell: pwsh
        run: |
          Get-ChildItem -File | Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS-WINDOWS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Leash-Windows-x64-${{ github.ref_name }}
          path: |
            apps/desktop/release/windows/*.exe
            apps/desktop/release/windows/*.blockmap
            apps/desktop/release/windows/latest.yml
            apps/desktop/release/windows/SHA256SUMS-WINDOWS

      - name: Attach immutable assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" release/windows/*.exe release/windows/*.blockmap release/windows/latest.yml release/windows/SHA256SUMS-WINDOWS --clobber
