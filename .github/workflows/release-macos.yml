name: Release Leash for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout Leash monorepo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install monorepo dependencies
        shell: bash
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./apps/desktop/package.json').version")
          test "v$package_version" = "${{ github.ref_name }}"

      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          npm run build -w @openleash/shared
          npm run typecheck -w @openleash/desktop-client
          npm run test -w @openleash/desktop-client
          npm run build -w @openleash/desktop-client

      - name: Build unsigned development DMG
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          npx electron-rebuild -v 43.3.0 -w better-sqlite3 --force
          npx electron-builder --config electron-builder.mac.yml --mac --arm64 --publish never

      - name: Verify unsigned development package
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find release/macos -type d -name 'Leash.app' -print -quit)
          test -n "$app_path"
          test -x "$app_path/Contents/MacOS/Leash"
          test -x "$app_path/Contents/Resources/app.asar.unpacked/dist/openleash-island"

      - name: Require production signing and notarization credentials
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Build signed and notarized production DMG
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          npx electron-rebuild -v 43.3.0 -w better-sqlite3 --force
          node - <<'NODE'
          const fs = require("node:fs");
          const yaml = require("js-yaml");
          const config = yaml.load(fs.readFileSync("electron-builder.mac.yml", "utf8"));
          config.forceCodeSigning = true;
          delete config.mac.identity;
          config.mac.notarize = true;
          fs.writeFileSync("electron-builder.mac.release.yml", yaml.dump(config));
          NODE
          npx electron-builder --config electron-builder.mac.release.yml --mac --arm64 --publish never

      - name: Notarize and staple production DMG container
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg_path=$(find release/macos -maxdepth 1 -type f -name 'Leash-*.dmg' -print -quit)
          test -n "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 2h
          xcrun stapler staple "$dmg_path"

      - name: Verify production signature and notarization
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find release/macos -type d -name 'Leash.app' -print -quit)
          dmg_path=$(find release/macos -maxdepth 1 -type f -name 'Leash-*.dmg' -print -quit)
          test -n "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          hdiutil verify "$dmg_path"
          printf 'codesign, Gatekeeper, notarization staple, and DMG integrity verified by workflow %s\n' "$GITHUB_RUN_ID" \
            > release/macos/MACOS-NOTARIZATION-VERIFIED

      - name: Smoke-test fresh install and running-app upgrade
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          dmg_path=$(find release/macos -maxdepth 1 -type f -name 'Leash-*.dmg' -print -quit)
          test -n "$dmg_path"
          bash ../../scripts/smoke-macos-installer.sh "$dmg_path" ../../scripts/install-openleash-personal.sh

      - name: Create checksums
        working-directory: apps/desktop/release/macos
        shell: bash
        run: |
          set -euo pipefail
          cp ../../../../scripts/install-openleash-personal.sh .
          chmod +x install-openleash-personal.sh
          shasum -a 256 Leash-*.dmg *.blockmap latest-mac.yml install-openleash-personal.sh > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Leash-macOS-arm64-${{ github.ref_name }}
          path: |
            apps/desktop/release/macos/*.dmg
            apps/desktop/release/macos/*.blockmap
            apps/desktop/release/macos/latest-mac.yml
            apps/desktop/release/macos/install-openleash-personal.sh
            apps/desktop/release/macos/SHA256SUMS
            apps/desktop/release/macos/MACOS-NOTARIZATION-VERIFIED

      - name: Attach immutable assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" release/macos/*.dmg release/macos/*.blockmap release/macos/latest-mac.yml release/macos/install-openleash-personal.sh release/macos/SHA256SUMS release/macos/MACOS-NOTARIZATION-VERIFIED --clobber
