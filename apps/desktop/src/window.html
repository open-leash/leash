      function historyCardHtml(item) {
        const status = historyStatusLabel(item.resolution || item.decision);
        const statusTone = status === "Approved" ? "good" : status === "Waiting for you" || status === "Checked" ? "" : "bad";
        const evidence = filePathForEvent(item) ? compactPath(filePathForEvent(item)) : prettyEvidence((item.triggered_policies || [])[0] || {}, item);
        const when = item.created_at || item.createdAt;
        return `
          <article data-event="${escapeHtml(item.id)}" class="historyDetailed ${readHistoryIds.has(String(item.id)) ? "" : "unread"}">

      function historyStatusLabel(value) {
        const normalized = String(value || "").toLowerCase();
        if (["deny", "denied", "rejected"].includes(normalized)) return "Denied";
        if (["block", "blocked", "stop", "stopped"].includes(normalized)) return "Blocked";
        if (["ask", "waiting", "pending", "review", "needs_review"].includes(normalized)) return "Waiting for you";
        if (["allow", "allowed", "approved", "passed"].includes(normalized)) return "Approved";
        return "Checked";
      }

      function friendlyExactTimestamp(value) {
        const date = new Date(value || 0);
        if (Number.isNaN(date.getTime())) return "Time unavailable";
        return date.toLocaleString([], { weekday: "short", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit", timeZoneName: "short" });
      }

      async function loadHistoryPage(page, agentKind = "", reset = false) {
        if (historyLoading) return;
        historyLoading = true;
        historyError = "";
        renderView();
        try {
          const result = await window.openleash.loadHistory?.({ page, limit: 12, agentKind });
          const next = Array.isArray(result?.history) ? result.history : [];
          const existing = reset ? [] : (state.history || []);
          const byId = new Map(existing.map((item) => [String(item.id), item]));
          next.forEach((item) => byId.set(String(item.id), item));
          state.history = [...byId.values()].sort((a, b) => new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime());
          historyPage = page;
          historyHasMore = Boolean(result?.pagination?.hasMore);
        } catch {
          historyError = "History could not load. Please try again.";
        } finally {
          historyLoading = false;
          renderView();
        }
      }

                  <span class="debugColumn debugEventColumn"><small>Event</small><strong>${escapeHtml(row.eventName)}</strong></span>
                  <span class="debugColumn debugTimeColumn" title="${escapeHtml(exactTimestamp(row.createdAt))}"><small>Timestamp</small><strong>${escapeHtml(humanTimestamp(row.createdAt))}</strong></span>
                  <span class="debugColumn debugSummaryColumn"><small>Summary</small><strong>${escapeHtml(row.summary)}</strong></span>

                </summary>
                <div class="debugDetail">
                  <div class="debugMeta">
                    <div class="kv"><small>Feature</small><strong>${escapeHtml(featureNameFromIdentifier(row.pluginId))}</strong></div>

                    <div class="kv"><small>Timestamp</small><strong title="${escapeHtml(exactTimestamp(row.createdAt))}">${escapeHtml(humanTimestamp(row.createdAt))}</strong></div>

      function localPluginDebugRows() {
        return (state.history || [])
          .flatMap((item) => {
            const runs = Array.isArray(item.payload?.openleashPluginRuns) ? item.payload.openleashPluginRuns : [];
            const responsibleRun = runs.find((run) => ["blocked", "needs_question", "failed"].includes(String(run.status || "").toLowerCase()));
            const context = {
              eventName: item.event_name || item.payload?.eventName || "event",
              agentName: item.agent_name,
              projectPath: item.project_path,
              sessionId: item.payload?.sessionId
            };
            const lifecycle = [{
              id: `${item.id}:received`,
              pluginId: logPluginSlug(responsibleRun?.pluginId || responsibleRun?.plugin_id || "openleash-core"),
              level: item.decision === "ask" ? "security" : item.decision === "deny" ? "security" : "debug",
              summary: item.decision === "ask" ? "Approval requested; agent hook is waiting." : `Hook evaluated: ${item.decision || "recorded"}.`,
              ...context,
              createdAt: item.created_at,
              raw: { stage: "evaluated", timestamp: item.created_at, decisionId: item.id, decision: item.decision, question: item.question }
            }];
            if (resolutionTime(item)) lifecycle.push({
              id: `${item.id}:resolved`,
              pluginId: "openleash.approval",
              level: item.resolution === "deny" ? "security" : "debug",
              summary: `Approval resolved: ${item.resolution || item.decision}.`,
              ...context,
              createdAt: resolutionTime(item),
              raw: { stage: "resolved", timestamp: resolutionTime(item), decisionId: item.id, resolution: item.resolution }
            });
            return [...lifecycle, ...runs.map((run, index) => ({
              id: `${item.id}:${index}`,
              pluginId: logPluginSlug(run.pluginId || run.plugin_id || "openleash.plugin"),
              level: run.error ? "error" : run.decision === "deny" ? "security" : "debug",
              summary: normalizeTokenSaverText(run.summary || run.message || run.kind || "Feature check completed."),
              ...context,
              createdAt: item.created_at,
              raw: { pluginRun: run, event: item }
            }))];
          })
          .sort((left, right) => new Date(right.createdAt || 0).getTime() - new Date(left.createdAt || 0).getTime())
          .slice(0, 120);
      }

      function exactTimestamp(value) {
        const date = new Date(value || 0);
        return Number.isNaN(date.getTime()) ? String(value || "Unknown") : `${date.toLocaleString()} · ${date.toISOString()}`;
      }

      function humanTimestamp(value) {
        const date = new Date(value || 0);
        if (Number.isNaN(date.getTime())) return String(value || "Unknown");
        const elapsed = Math.max(0, Date.now() - date.getTime());
        const minutes = Math.floor(elapsed / 60000);
        if (minutes < 1) return "just now";
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24 && date.toDateString() === new Date().toDateString()) return `${hours}h ago`;
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        if (date.toDateString() === yesterday.toDateString()) return `Yesterday at ${date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
        const days = Math.floor(elapsed / 86400000);
        if (days < 7) return `${days}d ago`;
        return date.toLocaleDateString([], { month: "short", day: "numeric", year: date.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
      }

      function logPluginSlug(value) {
        return canonicalPluginSlug(value);
      }

      function normalizeTokenSaverText(value) {
        return String(value || "")
          .replace(/(?:prompt|token)[ -]compression(?: plugin)?/gi, "token-saver")
          .replace(/token saver/gi, "token-saver");
      }

      function renderEventDetail() {

          </div>
          <div class="detailStack">
            <div class="card">
              <div class="kv"><small>Result</small><strong>${escapeHtml(statusLabel(item.resolution || item.decision))}</strong></div>
              <div class="kv"><small>Agent</small><strong>${escapeHtml(item.agent_name)}</strong></div>
              <div class="kv"><small>Project</small><strong>${escapeHtml(projectTag(item.project_path) || "No project")}</strong></div>
              ${filePathForEvent(item) ? `<div class="kv"><small>File path</small><strong>${escapeHtml(filePathForEvent(item))}</strong></div>` : ""}
              <div class="kv"><small>Triggered</small><strong>${formatTime(item.created_at)}</strong></div>
              ${resolutionTime(item) ? `<div class="kv"><small>${escapeHtml(resolutionLabel(item))}</small><strong>${formatTime(resolutionTime(item))}</strong></div>` : ""}
            </div>
            <div class="card">
              <h2>Why Leash noticed it</h2>
              ${(item.triggered_policies || []).map((policy) => `
                <div class="kv"><small>${escapeHtml(policy.policy_name)}</small><strong>${escapeHtml(prettyEvidence(policy, item))}</strong></div>
              `).join("") || `<p>No rule evidence was recorded.</p>`}

              ${transcript.length ? transcript.map((msg) => `<div class="kv"><small>${escapeHtml(msg.role === "user" ? "Your request" : "Agent")}</small><strong>${escapeHtml(msg.content || "")}</strong></div>`).join("") : `<p>No conversation details were included with this event.</p>`}
            </div>
            <details class="card"><summary><strong>Technical details</strong></summary><div class="pre" style="margin-top:14px">${escapeHtml(JSON.stringify(item.payload || {}, null, 2))}</div></details>
          </div>
        `;
        document.getElementById("backHistory").onclick = () => {
          view = eventReturnView === "plugin-detail" ? "plugin-detail" : selectedAgentHistoryKind ? "agent-history" : "history";
          renderView();
        };
        document.getElementById("copyEvent").onclick = async () => {
          await copyEventJson(item);
          showEventNotice("Event JSON copied.");
        };
        document.getElementById("shareEvent").onclick = async () => {
          const shared = await shareEvent(item);
          showEventNotice(shared ? "Share opened." : "Sharing is not available here, so JSON was copied.");
        };
        const resolveEvent = async (resolution) => {
          const denyButton = document.getElementById("denyEvent");
          const approveButton = document.getElementById("approveEvent");
          if (denyButton) denyButton.disabled = true;
          if (approveButton) approveButton.disabled = true;
          showEventNotice(resolution === "allow" ? "Approving…" : "Denying…");
          const skillPath = typeof item.payload?.skillPath === "string"
            ? item.payload.skillPath
            : undefined;
          const result = await window.openleash.resolve?.(
            item.id,
            resolution,
            "",
            0,
            skillPath ? { skillPath } : undefined,
          );
          if (!result?.ok) {
            if (denyButton) denyButton.disabled = false;
            if (approveButton) approveButton.disabled = false;
            showEventNotice("Leash could not save that decision. Try again.");
            return;
          }
          item.resolution = resolution;
          item.resolved_at = new Date().toISOString();
          state.pending = (state.pending || []).filter((pending) => String(pending.id) !== String(item.id));
          selectedEventId = "";
          view = eventReturnView === "plugin-detail" ? "plugin-detail" : selectedAgentHistoryKind ? "agent-history" : "history";
          renderView();
          setTimeout(() => {
            if (view === "history" || view === "agent-history")
              void loadHistoryPage(1, view === "agent-history" ? selectedAgentHistoryKind : "", true);
          }, 600);
        };
        document.getElementById("denyEvent")?.addEventListener("click", () => void resolveEvent("deny"));
        document.getElementById("approveEvent")?.addEventListener("click", () => void resolveEvent("allow"));
        bindNotificationCenter();
      }

      function renderSkillMarkdown(content) {
        const lines = String(content || "").replace(/\r\n/g, "\n").split("\n");
        const parts = [];
        let paragraph = [];
        let list = [];
        let inCode = false;
        let code = [];

        const flushParagraph = () => {
          if (!paragraph.length) return;
          parts.push(`<p>${escapeHtml(paragraph.join(" "))}</p>`);
          paragraph = [];
        };
        const flushList = () => {
          if (!list.length) return;
          parts.push(`<ul>${list.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`);
          list = [];
        };
        const flushCode = () => {
          parts.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
          code = [];
        };

        for (const line of lines) {
          if (line.trim().startsWith("```")) {
            if (inCode) {
              flushCode();
              inCode = false;
            } else {
              flushParagraph();
              flushList();
              inCode = true;
            }
            continue;
          }
          if (inCode) {
            code.push(line);
            continue;
          }
          const trimmed = line.trim();
          if (!trimmed) {
            flushParagraph();
            flushList();
            continue;
          }
          if (trimmed.startsWith("### ")) {
            flushParagraph();
            flushList();
            parts.push(`<h3>${escapeHtml(trimmed.slice(4))}</h3>`);
            continue;
          }
          if (trimmed.startsWith("## ")) {
            flushParagraph();
            flushList();
            parts.push(`<h2>${escapeHtml(trimmed.slice(3))}</h2>`);
            continue;
          }
          if (trimmed.startsWith("# ")) {
            flushParagraph();
            flushList();
            parts.push(`<h2>${escapeHtml(trimmed.slice(2))}</h2>`);
            continue;
          }
          const bullet = trimmed.match(/^[-*]\s+(.+)$/);
          if (bullet) {
            flushParagraph();
            list.push(bullet[1]);
            continue;
          }
          paragraph.push(trimmed);
        }
        if (inCode) flushCode();
        flushParagraph();
        flushList();
        return parts.join("") || `<p>No readable content.</p>`;
      }

      function overviewAgentInventory() {
        const detected = new Map((state.localProtections || []).map((agent) => [agent.kind, agent]));
        const catalog = [
          { kind: "claude-code", displayName: "Claude Code", icon: "claude.png" },
          { kind: "github-copilot", displayName: "GitHub Copilot", icon: "githubcopilot.svg" },
          { kind: "gemini", displayName: "Google Gemini CLI", icon: "googlegemini.svg" },
          { kind: "opencode", displayName: "OpenCode", icon: "opencode.png" },
          { kind: "codex", displayName: "OpenAI Codex", icon: "codex.png" },
          { kind: "cline", displayName: "Cline", icon: "cline.png" },
          { kind: "cursor", displayName: "Cursor", icon: "cursor.png" },
          { kind: "windsurf", displayName: "Windsurf", icon: "windsurf.svg" }
        ];
        const merged = catalog.map((definition) => {
          const detectedAgent = detected.get(definition.kind);
          const installed = Boolean(detectedAgent?.installed);
          const protectedAgent = Boolean(detectedAgent?.protected);
          return {
            ...definition,
            ...(detectedAgent || {}),
            installed,
            protected: protectedAgent,
            desiredMonitored: typeof detectedAgent?.desiredMonitored === "boolean" ? detectedAgent.desiredMonitored : protectedAgent,
            detail: detectedAgent?.detail || (
              installed
                ? protectedAgent ? "Active" : "Unmonitored"
                : "Not installed"
            )
          };
        });
        return merged;
      }

      function agentKindForName(name) {
        const text = String(name || "").toLowerCase();
        if (text.includes("claude")) return "claude-code";
        if (text.includes("codex") || text.includes("openai")) return "codex";
        if (text.includes("gemini")) return "gemini";
        if (text.includes("cursor")) return "cursor";
        if (text.includes("windsurf")) return "windsurf";
        if (text.includes("cline")) return "cline";
        if (text.includes("opencode")) return "opencode";
        return "";
      }

      function agentHighlights() {
        const agentsByKind = new Map((state.localProtections || []).map((agent) => [agent.kind, agent]));
        const groups = new Map();
        for (const item of visibleHistoryItems()) {
          const highlight = classifyHighlight(item);
          if (!highlight) continue;
          const key = item.agent_kind || item.agent_name || "unknown";
          const group = groups.get(key) || {
            agent: agentsByKind.get(item.agent_kind) || {
              kind: item.agent_kind,
              displayName: item.agent_name,
              icon: iconNameForAgent(item.agent_name)
            },
            project: projectTag(item.project_path),
            actions: []
          };
          if (group.actions.length < 5) {
            group.actions.push({
              ...highlight,
              date: formatTime(item.created_at)
            });
          }
          groups.set(key, group);
        }
        return [...groups.values()].slice(0, 8);
      }

      function currentAgentCards() {
        return (state.agents || []).slice(0, 8).map((agent) => {
          const pending = (state.pending || []).find((item) =>
            (item.agent_kind && item.agent_kind === agent.kind) ||
            (item.agent_name && item.agent_name === agent.display_name)
          );
          const source = pending || agent;
          const decision = pending ? "ask" : agent.resolution || agent.decision || "";
          const rule = firstPolicyName(source);
          const project = projectTag(source.project_path || agent.project_path) || "No project";
          const summary = pending
            ? pending.question || pending.summary || "Waiting for approval."
            : agent.short_summary || summarizeAgentNow(agent);
          const details = agentDetails(agent, source);
          return {
            kind: agent.kind,
            icon: iconNameForAgent(agent.display_name),
            displayName: agent.display_name || "AI agent",
            host: agent.hostname || "This computer",
            when: source.created_at ? formatTime(source.created_at) : source.activity_at ? formatTime(source.activity_at) : agent.activity_at ? formatTime(agent.activity_at) : "No recent history",
            status: statusLabel(decision),
            statusClass: decision === "ask" ? "" : decision === "deny" || decision === "denied" ? "bad" : "good",
            summary: truncate(cleanAgentSummary(summary, decision), 160),
            project,
            action: friendlyAction(source.event_name || agent.event_name, source.tool_name || agent.tool_name),
            rule,
            details
          };
        });
      }

      function summarizeAgentNow(agent) {
        const action = friendlyAction(agent.event_name, agent.tool_name);
        const project = projectTag(agent.project_path);
        if (agent.decision_summary) return agent.decision_summary;
        if (agent.event_name || agent.tool_name) return `${agent.display_name || "Agent"} is ${action.toLowerCase()}${project ? ` in ${project}` : ""}.`;
        return `${agent.display_name || "Agent"} is connected and waiting.`;
      }

      function agentDetails(agent, source) {
        const quote = highlightQuote(source);
        const details = [];
        if (quote && quote !== "Action captured by Leash") {
          details.push({ label: source.event_name === "UserPromptSubmit" ? "Prompt" : "Details", value: truncate(quote, 150) });
        }
        const latest = Array.isArray(agent.recent_activity)
          ? agent.recent_activity.find((item) => item.summary && item.summary !== source.summary)
          : undefined;
        if (latest?.summary) {
          details.push({ label: "Previous", value: truncate(`${friendlyAction(latest.event_name, latest.tool_name)} · ${cleanAgentSummary(latest.summary, latest.decision || "")}`, 140) });
        }
        return details.slice(0, 2);
      }

      function cleanAgentSummary(summary, decision = "") {
        const value = String(summary || "").trim()
          .replace(/^(Allowed|Denied|Blocked|Waiting|Needs approval|Active)\s*·\s*/i, "")
          .replace(/^Using Write on\s+/i, "Editing ")
          .replace(/^Claude Code is /i, "")
          .replace(/^Agent is /i, "");
        if ((decision === "deny" || decision === "denied") && /^denied\b/i.test(value)) {
          return value.replace(/^denied\s*[·:-]?\s*/i, "");
        }
        if ((decision === "allow" || decision === "allowed") && /^allowed\b/i.test(value)) {
          return value.replace(/^allowed\s*[·:-]?\s*/i, "");
        }
        return value || "Action captured by Leash.";
      }

      function visibleHistoryItems() {
        return (state.history || []).filter((item) => !isPassOnlyEvent(item));
      }

      function isPassOnlyEvent(item) {
        return item.decision === "allow"
          && (!item.resolution || item.resolution === "allow")
          && !item.tool_name
          && !(item.triggered_policies || []).length
          && /all active policies passed/i.test(item.summary || "");
      }

      function displayEventSummary(item) {
        const filePath = filePathForEvent(item);
        if (/^Write$/i.test(item.tool_name || "") && filePath) return `Editing ${filePath}`;
        return cleanAgentSummary(item.summary, item.resolution || item.decision);
      }

      function firstPolicyName(item) {
        return (item.triggered_policies || []).map((policy) => policy.policy_name).find(Boolean) || "";
      }

      function statusLabel(value) {
        if (value === "ask") return "Waiting";
        if (value === "deny" || value === "denied") return "Denied";
        if (value === "allow" || value === "allowed") return "Allowed";
        return "Active";
      }

      function friendlyAction(eventName, toolName) {
        if (/^Write$/i.test(toolName || "")) return "Editing";
        if (/^MultiEdit$/i.test(toolName || "")) return "Editing";
        if (toolName) return `Using ${toolName}`;
        if (eventName === "UserPromptSubmit") return "Reading prompt";
        if (eventName === "PreToolUse") return "Preparing tool";
        if (eventName === "PostToolUse") return "Reviewing result";
        if (eventName === "Stop") return "Finishing session";
        return eventName || "Connected";
      }

      function classifyHighlight(item) {
        if (item.decision === "allow" && (!item.triggered_policies || item.triggered_policies.length === 0)) return null;
        const text = eventText(item).toLowerCase();
        const filePath = filePathForEvent(item);
        const quote = filePath ? compactPath(filePath) : highlightQuote(item);
        const policyLabel = labelFromPolicy(item);
        if (policyLabel) return { label: policyLabel, quote, filePath };
        const checks = [
          ["Git repo creation", /\bgit\s+init\b|gh repo create|create (a )?(new )?git repo|create (a )?(new )?repository|initialize (a )?(new )?(git )?repo/],
          ["Credential file read", /\bread\b.*\.env|\bcat\b.*\.env|\bopen\b.*\.env|\bshow\b.*\.env|\bprint\b.*\.env|find .*\.env|search .*\.env|\.env.*read|\.env.*search|\.env.*find/],
          ["Credential file change", /\bwrite\b.*\.env|\bcreate\b.*\.env|\btouch\b.*\.env|\bedit\b.*\.env|\.env.*write|\.env.*create|\.env.*edit/],
          ["Secrets exposure", /private key|api[_ -]?key|secret|token|password|kubeconfig|\.npmrc|id_rsa|id_ed25519|credentials/],
          ["External sharing", /curl|wget|upload|pastebin|gist|send .*code|post .*secret|external domain|webhook/],
          ["New MCP config", /mcp|model context protocol|mcp\.json|\.cursor\/mcp|claude_desktop_config/],
          ["New VS Code settings", /settings\.json|keybindings\.json|extensions\.json|\.vscode/],
          ["New cron jobs / launch agents", /crontab|cron job|launchagent|launchdaemon|plist|launchctl/],
          ["New background processes", /nohup|pm2|systemctl|brew services|background process|daemon|&\s*$|disown/],
          ["Shell profile changed", /\.zshrc|\.bashrc|\.bash_profile|\.profile|shell profile|path export/],
          ["Git config changed", /git config|\.gitconfig|insteadOf|credential.helper|core\.hooksPath/],
          ["Packages installed", /npm install|pnpm add|yarn add|pip install|brew install|cargo install|gem install/],
          ["Files created", /\btouch\b|new file|file created|create file|\bwrite\b.*\.(ts|tsx|js|jsx|py|go|rs|java|rb|php|html|css|md|json|yaml|yml)\b/],
          ["Files modified", /\bedit\b|\bmultiedit\b|\bmodify\b|\bpatch\b|file modified|changed file/]
        ];
        const match = checks.find(([, pattern]) => pattern.test(text));
        if (!match) return null;
        return { label: match[0], quote, filePath };
      }

      function labelFromPolicy(item) {
        const policyNames = (item.triggered_policies || []).map((policy) => String(policy.policy_name || "").toLowerCase()).join("\n");
        const text = `${policyNames}\n${eventText(item).toLowerCase()}`;
        if (!policyNames && !text.trim()) return null;
        const filePath = filePathForEvent(item).toLowerCase();
        const secretPath = /(^|\/)(\.env|\.npmrc|id_rsa|id_ed25519|credentials|kubeconfig)(\.|$|\/)/.test(filePath);
        if (/credential|secret|\.env|token|private key|kubeconfig|\.npmrc|id_rsa|id_ed25519/.test(text)) {
          if (/\b(read|cat|open|show|print|search|find|grep|scan|dump|copy)\b/.test(text)) return "Credential file read";
          if (/\b(write|create|edit|touch|generate|save)\b/.test(text)) return "Credential file change";
          return "Credential access";
        }
        if (secretPath) return "Credential file touched";
        if (/git repo|repository|git init/.test(text)) return "Git repo creation";
        if (/destructive|rm -rf|delete|terraform destroy|git reset/.test(text)) return "Destructive command";
        if (/personal data|pii|ssn|passport|credit card|customer/.test(text)) return "Personal data use";
        if (/external|exfiltrat|upload|webhook|pastebin|gist/.test(text)) return "External sharing";
        if (/package|npm install|pip install|brew install/.test(text)) return "Package installation";
        return null;
      }

      function eventText(item) {
        return [
          item.summary,
          item.question,
          item.event_name,
          item.tool_name,
          item.project_path,
          JSON.stringify(item.payload || {}),
          ...(item.triggered_policies || []).flatMap((policy) => [policy.policy_name, policy.explanation, ...(Array.isArray(policy.evidence) ? policy.evidence : [policy.evidence])])
        ].filter(Boolean).join("\n");
      }

      function highlightQuote(item) {
        const evidence = (item.triggered_policies || []).flatMap((policy) => Array.isArray(policy.evidence) ? policy.evidence : [policy.evidence]).find(Boolean);
        const payload = item.payload || {};
        const toolInput = payload.tool?.input;
        const command = typeof toolInput === "object" && toolInput ? (toolInput.command || toolInput.file_path || toolInput.path || toolInput.url) : toolInput;
        return truncate(String(evidence || command || payload.prompt || item.summary || "Action captured by Leash"), 140);
      }

      function filePathForEvent(item) {
        if (item.file_path) return String(item.file_path);
        const payload = item.payload || {};
        if (typeof payload.skillPath === "string" && payload.skillPath)
          return normalizePathForDisplay(payload.skillPath, item.project_path);
        const toolInput = payload.tool?.input;
        if (toolInput && typeof toolInput === "object") {
          const direct = toolInput.file_path || toolInput.path || toolInput.filename || toolInput.filepath;
          if (direct) return normalizePathForDisplay(String(direct), item.project_path);
        }
        if (typeof toolInput === "string") {
          const fromTool = pathFromText(toolInput);
          if (fromTool) return normalizePathForDisplay(fromTool, item.project_path);
        }
        const evidence = (item.triggered_policies || [])
          .flatMap((policy) => Array.isArray(policy.evidence) ? policy.evidence : [policy.evidence])
          .find(Boolean);
        const fromEvidence = pathFromText(String(evidence || ""));
        if (fromEvidence) return normalizePathForDisplay(fromEvidence, item.project_path);
        const fromPayload = pathFromText(JSON.stringify(payload || {}));
        return fromPayload ? normalizePathForDisplay(fromPayload, item.project_path) : "";
      }

      function pathFromText(text) {
        if (!text) return "";
        const jsonPath = text.match(/"file_path"\s*:\s*"([^"]+)"/i)?.[1] ||
          text.match(/"path"\s*:\s*"([^"]+)"/i)?.[1];
        if (jsonPath) return jsonPath;
        const absolute = text.match(/(?:^|[\s"'`])((?:~|\/Users\/|\/private\/|\/tmp\/|\/var\/|\/etc\/|\/opt\/)[^\s"'`,;)]{2,})/i)?.[1];
        if (absolute) return absolute;
        const relative = text.match(/(?:^|[\s"'`])((?:\.{1,2}\/)?[A-Za-z0-9_.-]*\.env(?:\.[A-Za-z0-9_.-]+)?|(?:\.{1,2}\/)?[A-Za-z0-9_./-]+\/(?:\.env|\.npmrc|id_rsa|id_ed25519|credentials|kubeconfig))(?:$|[\s"'`,;)])/i)?.[1];
        if (relative) return relative;
        return /\.env(?:\b|["'\\/\s])/.test(text) ? ".env" : "";
      }

      function normalizePathForDisplay(filePath, projectPath) {
        const value = String(filePath || "").trim().replace(/^['"`]+|['"`]+$/g, "");
        if (!value) return "";
        if (value === ".env" && projectPath) return `${String(projectPath).replace(/\/+$/, "")}/.env`;
        if ((value.startsWith("./") || value.startsWith("../")) && projectPath) return `${String(projectPath).replace(/\/+$/, "")}/${value}`;
        if (!value.startsWith("/") && !value.startsWith("~") && !value.includes("://") && projectPath && value.includes("/")) {
          return `${String(projectPath).replace(/\/+$/, "")}/${value}`;
        }
        return value.replace(/^file:\/\//, "");
      }

      function compactPath(filePath) {
        return String(filePath || "").replace(/^\/Users\/[^/]+/, "~");
      }

      function evidencePreview(item) {
        const text = prettyEvidence((item.triggered_policies || [])[0] || {}, item);
        return text ? `<div class="evidenceLine">${escapeHtml(truncate(text, 120))}</div>` : "";
      }

      function prettyEvidence(policy, item) {
        const evidence = Array.isArray(policy.evidence) ? policy.evidence.find(Boolean) : policy.evidence;
        const text = String(evidence || policy.explanation || "");
        const filePath = filePathForEvent(item);
        if (filePath && /"file_path"\s*:|"path"\s*:|\.env|kubeconfig|\.npmrc|id_rsa|id_ed25519|credentials/i.test(text)) {
          return filePath;
        }
        return text;
      }

      function fileLine(filePath) {
        const compact = compactPath(filePath);
        return `
          <span class="fileLine" title="${escapeHtml(filePath)}">
            <span class="fileTypeIcon">${fileIconForPath(filePath)}</span>
            <span class="fileName">${escapeHtml(compact)}</span>
          </span>
        `;
      }

      function fileIconForPath(filePath) {
        const value = String(filePath || "").toLowerCase();
        const name = value.split("/").pop() || "";
        if (name === ".env" || name.startsWith(".env.") || value.includes("secret") || value.includes("credential")) return "🔐";
        if (name === ".npmrc" || name.includes("token")) return "🔑";
        if (name.includes("kubeconfig") || name === "config") return "☸";
        if (name.endsWith(".json")) return "{}";
        if (name.endsWith(".yml") || name.endsWith(".yaml")) return "Y";
        if (name.endsWith(".py")) return "Py";
        if (name.endsWith(".ts") || name.endsWith(".tsx")) return "TS";
        if (name.endsWith(".js") || name.endsWith(".jsx")) return "JS";
        if (name.endsWith(".md")) return "Md";
        if (name.endsWith(".sh") || name.endsWith(".zsh") || name.endsWith(".bash")) return "$";
        if (name.includes("id_rsa") || name.includes("id_ed25519") || name.endsWith(".pem") || name.endsWith(".key")) return "🔑";
        return "📄";
      }

      function sharePayloadForEvent(item) {
        const rules = (item.triggered_policies || []).map((policy) => ({
          name: policy.policy_name,
          status: policy.status,
          severity: policy.severity,
          explanation: policy.explanation,
          evidence: Array.isArray(policy.evidence) ? policy.evidence : (policy.evidence ? [policy.evidence] : [])
        }));
        const transcript = (item.payload?.transcript || []).slice(-5).reverse().map((message) => ({
          role: message.role || "message",
          content: message.content || ""
        }));
        return {
          product: "Leash",
          exported_at: new Date().toISOString(),
          event: {
            id: item.id,
            status: item.resolution || item.decision,
            summary: displayEventSummary(item),
            agent: item.agent_name,
            agent_kind: item.agent_kind,
            project: projectTag(item.project_path) || "",
            project_path: item.project_path || "",
            file_path: filePathForEvent(item) || "",
            triggered_at: item.created_at,
            resolved_at: resolutionTime(item) || "",
            resolution_label: resolutionTime(item) ? resolutionLabel(item) : "",
            rules,
            conversation_context: transcript,
            raw_payload: item.payload || {}
          }
        };
      }

      function eventJson(item) {
        return JSON.stringify(sharePayloadForEvent(item), null, 2);
      }

      async function copyEventJson(item) {
        await window.openleash.copyText(eventJson(item));
      }

      async function shareEvent(item) {
        const data = sharePayloadForEvent(item);
        const text = eventJson(item);
        const title = `Leash event - ${data.event.agent}`;
        if (navigator.share && (!navigator.canShare || navigator.canShare({ title, text }))) {
          try {
            await navigator.share({ title, text });
            return true;
          } catch (error) {
            if (error && error.name === "AbortError") return true;
          }
        }
        await copyEventJson(item);
        return false;
      }

                    <div class="proxyAgentCard"><div><strong>OpenAI Codex</strong><p>Leash Responses API provider.</p></div><label class="toggleRow"><input data-proxy-agent="codex" type="checkbox" ${(state.proxyStatus?.configuredAgents || []).includes("codex") ? "checked" : ""} ${state.proxyStatus?.running ? "" : "disabled"}><span>Proxy</span></label></div>
                    <div class="proxyAgentCard"><div><strong>OpenCode</strong><p>Preserves existing provider options.</p></div><label class="toggleRow"><input data-proxy-agent="opencode" type="checkbox" ${(state.proxyStatus?.configuredAgents || []).includes("opencode") ? "checked" : ""} ${state.proxyStatus?.running ? "" : "disabled"}><span>Proxy</span></label></div>
                    <div class="proxyAgentCard"><div><strong>NanoClaw</strong><p>Claude-compatible local adapter.</p></div><label class="toggleRow"><input data-proxy-agent="nanoclaw" type="checkbox" ${(state.proxyStatus?.configuredAgents || []).includes("nanoclaw") ? "checked" : ""} ${state.proxyStatus?.running ? "" : "disabled"}><span>Proxy</span></label></div>
                  </div>
                  <div class="proxyInfo"><strong>Cursor and Cline</strong> use editor-managed provider settings. Local endpoints: OpenAI ${escapeHtml("http://127.0.0.1:9320/v1")} · Anthropic ${escapeHtml("http://127.0.0.1:9320")}. Copilot and OpenClaw remain protected through hooks where supported.</div>
                  <div class="actions left"><button class="secondary" id="refreshProxy">Refresh status</button><button class="${state.proxyStatus?.installed ? "secondary dangerButton" : "primary"}" id="toggleProxy">${state.proxyStatus?.installed ? "Stop proxy" : "Start proxy"}</button></div>
                  <div id="proxyMessage" class="notice">${escapeHtml(state.proxyStatus?.error || "")}</div>
                </div>
              </details>

              <details class="settingsDisclosure settingsDanger settingsSpan">
                <summary><div><span class="settingsEyebrow">Danger zone</span><div class="settingsDisclosureTitle"><strong>Reset or uninstall Leash</strong></div><p>Destructive device actions stay folded away until you need them.</p></div></summary>
                <div class="settingsDisclosureBody">
                  <div class="dangerGrid">
                    <div class="dangerRow"><div><strong>Delete data and settings</strong><p>Clear local cache, setup state, selected agents, and desktop preferences.</p></div><button class="secondary dangerButton" id="deleteDataAndSettings">Delete data and settings</button></div>
                    <div class="dangerRow"><div><strong>Uninstall Leash</strong><p>Restore managed agent configuration, remove hooks and proxy settings, delete any local Open Source runtime, and remove the desktop app and its data. Docker Desktop remains installed.</p></div><button class="secondary dangerButton" id="uninstallApplication">Uninstall Leash</button></div>
                    <div id="uninstallMessage" class="notice"></div>
                  </div>
                </div>
              </details>
            </div>
            <div class="settingsSaveBar"><button class="primary" id="saveSettings">Save preferences</button></div>
          </div>
        `;
        document.getElementById("refreshProxy").onclick = async () => {
          state.proxyStatus = await window.openleash.proxyStatus();
          renderSettings();
        };
        document.getElementById("toggleProxy").onclick = async () => {
          const message = document.getElementById("proxyMessage");
          message.textContent = state.proxyStatus?.installed ? "Restoring agent configuration and stopping the proxy…" : "Starting the bundled Leash proxy…";
          const result = state.proxyStatus?.installed
            ? await window.openleash.uninstallProxy()
            : await window.openleash.installProxy({ agents: (state.localProtections || []).filter((agent) => agent.installed && ["claude-code", "codex", "opencode", "nanoclaw"].includes(agent.kind)).map((agent) => agent.kind) });
          if (!result?.ok) { message.textContent = result?.error || "Proxy operation failed."; return; }
          state.proxyStatus = result;
          renderSettings();
        };
        root.querySelectorAll("[data-proxy-agent]").forEach((input) => {
          input.onchange = async () => {
            const result = await window.openleash.setAgentProxy({ kind: input.dataset.proxyAgent, enabled: input.checked });
            if (!result?.ok) {
              input.checked = !input.checked;
              document.getElementById("proxyMessage").textContent = result?.error || "Agent proxy configuration failed.";
              return;
            }
            state.proxyStatus = result;
          };
        });
        document.getElementById("addExcludedProject").onclick = async () => {
          const result = await window.openleash.chooseExcludedProject();
          if (!result?.ok) return;
          state.excludedProjectPaths = result.excludedProjectPaths || [];
          renderSettings();
        };
        root.querySelectorAll("[data-remove-excluded-project]").forEach((button) => {
          button.onclick = async () => {
            const result = await window.openleash.removeExcludedProject({
              projectPath: button.dataset.removeExcludedProject
            });
            if (!result?.ok) return;
            state.excludedProjectPaths = result.excludedProjectPaths || [];
            renderSettings();
          };
        });
        const agentDoneSoundInput = document.getElementById("agentDoneSound");
        const islandVisibilityInput = document.getElementById("islandVisibility");
        agentDoneSoundInput.onchange = async () => {
          const nextAgentDoneSound = agentDoneSoundInput.checked;
          state.agentDoneSound = nextAgentDoneSound;
          const result = await window.openleash.saveSettings({ agentDoneSound: nextAgentDoneSound });
          if (!result?.ok) {
            state.agentDoneSound = !nextAgentDoneSound;
            agentDoneSoundInput.checked = state.agentDoneSound;
            return;
          }
          state.apiProvider = "openai";
          state.apiKeySet = false;
          state.agentDoneSound = result.agentDoneSound;
          state.islandVisibility = result.islandVisibility;
          state.islandActivityOnly = result.islandActivityOnly;
          agentDoneSoundInput.checked = state.agentDoneSound;
          document.getElementById("settingsMessage").textContent = "Settings saved.";
        };
        islandVisibilityInput.onchange = async () => {
          const previousIslandVisibility = state.islandVisibility || (state.islandActivityOnly ? "activity" : "always");
          const nextIslandVisibility = islandVisibilityInput.value;
          state.islandVisibility = nextIslandVisibility;
          const result = await window.openleash.saveSettings({ islandVisibility: nextIslandVisibility });
          if (!result?.ok) {
            state.islandVisibility = previousIslandVisibility;
            islandVisibilityInput.value = previousIslandVisibility;
            return;
          }
          state.islandVisibility = result.islandVisibility;
          state.islandActivityOnly = result.islandActivityOnly;
          islandVisibilityInput.value = state.islandVisibility;
          document.getElementById("settingsMessage").textContent =
            state.islandVisibility === "off"
              ? "The Island is off. Leash remains available from the tray."
              : state.islandVisibility === "notifications"
              ? "The Island will appear only for notifications or when opened from the tray."
              : state.islandVisibility === "activity"
                ? "The Island will hide while all agents are idle."
                : "The Island will stay visible.";
        };
        document.getElementById("saveSettings").onclick = async () => {
          const agentDoneSound = document.getElementById("agentDoneSound").checked;
          const islandVisibility = document.getElementById("islandVisibility").value;
          const result = await window.openleash.saveSettings({ agentDoneSound, islandVisibility });
          if (result?.ok) {
            state.apiProvider = "openai";
            state.apiKeySet = false;
            state.agentDoneSound = result.agentDoneSound;
            state.islandVisibility = result.islandVisibility;
            state.islandActivityOnly = result.islandActivityOnly;
            document.getElementById("settingsMessage").textContent = "Settings saved.";
          }
        };
        document.getElementById("disconnectClient").onclick = async () => {
          const button = document.getElementById("disconnectClient");
          const message = document.getElementById("disconnectMessage");
          button.disabled = true;
          message.textContent = "Disconnecting Leash and removing monitoring from this Mac…";
          const result = await window.openleash.disconnectClient().catch((error) => ({
            ok: false,
            error: error?.message || "Could not disconnect this Mac."
          }));
          if (result?.restarting) {
            message.textContent = "Disconnected. Restarting Leash in the setup wizard…";
            return;
          }
          button.disabled = false;
          message.textContent = result?.canceled ? "" : result?.error || "Could not disconnect this Mac.";
        };
        document.getElementById("deleteDataAndSettings").onclick = async () => {
          const result = await window.openleash.deleteDataAndSettings();
          if (result?.restarting) document.getElementById("settingsMessage").textContent = "Deleting data and settings and restarting Leash...";
        };
        document.getElementById("uninstallApplication").onclick = async () => {
          const button = document.getElementById("uninstallApplication");
          const message = document.getElementById("uninstallMessage");
          button.disabled = true;
          message.textContent = "Preparing a complete Leash uninstall…";
          const result = await window.openleash.uninstallApplication().catch((error) => ({
            ok: false,
            error: error?.message || "Could not uninstall Leash."
          }));
          if (result?.uninstalling) {
            message.textContent = "Removing Leash. This window will close automatically…";
            return;
          }
          button.disabled = false;
          message.textContent = result?.canceled ? "" : result?.error || "Could not uninstall Leash.";
        };
      }

      function agentCards({ selectable }) {
        const agents = state.localProtections || [];
        if (agents.length === 0) return `<div class="card empty">No supported local agents were detected yet.</div>`;
        return `
          <div class="cardList">
            ${agents.map((agent) => {
              const checked = isSetupLocked() ? selectedAgents?.has(agent.kind) : agent.protected;
              return `
              <label class="card agentLine">
                <span class="agentIcon">${agentIcon(agent)}</span>
                <span><strong>${escapeHtml(agent.displayName)}</strong></span>
                <span class="switch"><input data-agent="${agent.kind}" type="checkbox" ${checked ? "checked" : ""} ${agent.installed && agent.supportsInstall ? "" : "disabled"} ${selectable ? "" : "disabled"}><span></span></span>
              </label>
            `}).join("")}
          </div>
        `;
      }

      function bindAgentSelection() {
        root.querySelectorAll("[data-agent]").forEach((input) => {
          input.onchange = () => {
            if (!selectedAgents) selectedAgents = new Set();
            input.checked ? selectedAgents.add(input.dataset.agent) : selectedAgents.delete(input.dataset.agent);
          };
        });
      }

      function bindRuleSelection() {
        root.querySelectorAll("[data-rule]").forEach((input) => {
          input.onchange = () => {
            if (!selectedRules) selectedRules = new Map();
            selectedRules.set(input.dataset.rule, Boolean(input.checked));
          };
        });
      }

      function initializePluginSetupState(force = false) {
        const plugins = state.plugins || [];
        if ((force || !selectedPlugins) && plugins.length > 0) {
          selectedPlugins = pluginSelectionTouched && selectedPlugins
            ? new Set([...selectedPlugins].filter((pluginId) => plugins.some((plugin) => plugin.id === pluginId)))
            : new Set(defaultPluginSelectionIds(plugins));
        }
        for (const plugin of plugins) {
          if (!pluginSetupConfigs[plugin.id] || force) {
            const enabled = Boolean(plugin.organizationPolicy?.mandatory || selectedPlugins?.has(plugin.id));
            pluginSetupConfigs[plugin.id] = {
              ...(plugin.defaultConfig || {}),
              ...(plugin.settings?.config || {}),
              enabled
            };
          }
        }
      }

      function pluginEvents(plugin) {
        return plugin.events || plugin.stages || [];
      }

      function canonicalPluginSlug(value) {
        const raw = String(value || "").trim();
        if (!raw) return "openleash-core";
        if (raw.toLowerCase() === "openleash.core") return "openleash-core";
        const unscoped = raw.replace(/^openleash\./i, "");
        const lower = unscoped.toLowerCase();
        const aliases = {
          "blast radius": "blast-radius",
          "prompt-compression": "token-saver",
          "prompt compression": "token-saver",
          "token-compression": "token-saver",
          "token compression": "token-saver",
          "token saver": "token-saver",
          "dlp": "data-leakage-prevention"
        };
        return aliases[lower] || lower.replace(/[\s_]+/g, "-");
      }

      const featurePresentations = Object.fromEntries(
        __LEASH_FEATURE_PRESENTATIONS__.map((presentation) => [presentation.slug, presentation])
      );

      function pluginCompatibilityName(plugin) {
        return canonicalPluginSlug(plugin.slug || plugin.marketplace?.slug || plugin.id || plugin.name);
      }

      function featureNameFromIdentifier(value) {
        const compatibilityName = canonicalPluginSlug(value);
        return featurePresentations[compatibilityName]?.name || settingLabel(compatibilityName) || "Feature";
      }

      function featurePresentation(plugin) {
        return featurePresentations[pluginCompatibilityName(plugin)];
      }

      function pluginName(plugin) {
        const presentation = featurePresentation(plugin);
        if (presentation) return presentation.name;
        const supplied = String(plugin.displayName || plugin.name || "").trim();
        if (supplied && !/^(?:openleash[._-])?[a-z0-9]+(?:[._-][a-z0-9]+)+$/i.test(supplied)) return supplied;
        return (settingLabel(pluginCompatibilityName(plugin)) || "Feature").replace(/^Leash\s+/i, "");
      }

      function pluginPackageName(plugin) {
        return pluginName(plugin);
      }

      function compactNumber(value) {
        const count = Number(value || 0);
        if (count >= 1000) {
          const rounded = Math.round(count / 100) / 10;
          return `${Number.isInteger(rounded) ? rounded.toFixed(0) : rounded}k`;
        }
        return String(count);
      }

      function pluginValueLine(plugin) {
        return featurePresentation(plugin)?.description || plugin.marketplace?.shortDescription || plugin.description || "";
      }

      function pluginIconText(plugin) {
        const marketplaceIcon = String(plugin.marketplace?.iconText || "").trim();
        if (marketplaceIcon && !/^[A-Z0-9]{1,3}$/.test(marketplaceIcon)) return marketplaceIcon;
        const directIcon = String(plugin.iconText || "").trim();
        if (directIcon && !/^[A-Z0-9]{1,3}$/.test(directIcon)) return directIcon;
        const selected = featurePresentation(plugin)?.iconText;
        if (selected) return selected;
        if (marketplaceIcon) return marketplaceIcon;
        if (directIcon) return directIcon;
        const source = pluginPackageName(plugin) || pluginName(plugin) || plugin.id || "plugin";
        const parts = String(source).split(/[^a-z0-9]+/i).filter(Boolean);
        return (parts.length > 1 ? parts.slice(0, 2).map((part) => part[0]).join("") : String(source).slice(0, 2)).toUpperCase();
      }

      function pluginIconHtml(plugin) {
        const image = String(plugin.marketplace?.visualPng || plugin.visualPng || "").trim();
        if (/^https:\/\//i.test(image) || /^data:image\/(png|jpeg|webp);base64,/i.test(image)) {
          return `<img src="${escapeHtml(image)}" alt="">`;
        }
        return escapeHtml(pluginIconText(plugin));
      }

      function ensurePluginSetupConfig(pluginId) {
        if (!pluginSetupConfigs[pluginId]) {
          const plugin = (state.plugins || []).find((item) => item.id === pluginId) || {};
          pluginSetupConfigs[pluginId] = {
            ...(plugin.defaultConfig || {}),
            ...(plugin.settings?.config || {}),
            enabled: plugin.organizationPolicy?.mandatory || plugin.settings?.enabled === true
          };
        }
        return pluginSetupConfigs[pluginId];
      }

      function comparePluginPopularity(left, right) {
        const categoryOrder = { protection: 0, cost: 1, visibility: 2, other: 3 };
        const categoryDifference = (categoryOrder[pluginCategory(left)] ?? 9) - (categoryOrder[pluginCategory(right)] ?? 9);
        return categoryDifference || pluginName(left).localeCompare(pluginName(right));
      }

      function setupFeatureShowcaseCards() {
        const plugins = [...(state.plugins || [])]
          .filter((plugin) => plugin.settings?.runtimeAvailable !== false)
          .sort((left, right) => {
            const leftOrder = featurePresentation(left)?.showcaseOrder ?? 999;
            const rightOrder = featurePresentation(right)?.showcaseOrder ?? 999;
            return leftOrder - rightOrder || pluginName(left).localeCompare(pluginName(right));
          });
        return `
          <div class="setupProtectionPromise">
            <span class="setupProtectionMark" aria-hidden="true">
              <svg viewBox="0 0 32 32"><path d="M16 3.5 26 7v7.5c0 6.4-4 11.2-10 13.5-6-2.3-10-7.1-10-13.5V7z"></path><path d="m11 15 3.1 3.2 6.9-7"></path></svg>
            </span>
            <div>
              <strong>Leash starts protecting you right away</strong>
              <p>Every safety check below turns on automatically. You can change any of them later.</p>
            </div>
            <span class="setupProtectionCount">${escapeHtml(String(plugins.length))} safety checks on</span>
          </div>
          <div class="setupFeatureGrid">
            ${plugins.map((plugin) => {
              const category = pluginCategory(plugin);
              return `
                <article class="setupFeatureCard ${escapeHtml(pluginCategoryClass(category))}">
                  <span class="setupFeatureIcon" aria-hidden="true">${pluginIconHtml(plugin)}</span>
                  <div class="setupFeatureHeading">
                    <strong>${escapeHtml(pluginName(plugin))}</strong>
                    <span class="setupFeatureOn">On automatically</span>
                  </div>
                  <p>${escapeHtml(pluginValueLine(plugin))}</p>
                </article>
              `;
            }).join("")}
          </div>
        `;
      }

      function setupPluginInstallCards() {
        const query = setupPluginSearch.trim().toLowerCase();
        const allPlugins = [...(state.plugins || [])].sort(comparePluginPopularity);
        const category = setupPluginCategory || "all";
        const categoryFiltered = category === "all"
          ? allPlugins
          : allPlugins.filter((plugin) => pluginCategory(plugin).toLowerCase() === category);
        const plugins = query
          ? categoryFiltered.filter((plugin) => pluginSearchText(plugin).includes(query))
          : categoryFiltered;
        if (allPlugins.length === 0) return `<div class="card empty">Leash could not load your safety choices. Try again in a moment.</div>`;
        const categories = pluginCategorySummary(allPlugins);
        return `
          <div class="pluginCategoryFilters">
            ${categories.map((item) => `
              <button type="button" data-plugin-category="${escapeHtml(item.id)}" class="${escapeHtml(pluginCategoryClass(item.id))} ${category === item.id ? "active" : ""}">
                ${categoryIcon(item.label)}
                <span>${escapeHtml(item.label)} ${escapeHtml(String(item.count))}</span>
              </button>
            `).join("")}
          </div>
          <div class="pluginMarketplaceTools">
            <input id="pluginMarketplaceSearch" value="${escapeHtml(setupPluginSearch)}" placeholder="Search safety and savings...">
            <span>${plugins.length} of ${categoryFiltered.length} shown</span>
          </div>
          <div class="cardList">
            ${plugins.map((plugin) => {
              const checked = selectedPlugins?.has(plugin.id) ?? Boolean(plugin.organizationPolicy?.mandatory || plugin.settings?.enabled === true);
              const mandatory = Boolean(plugin.organizationPolicy?.mandatory);
              const category = pluginCategory(plugin);
              const categoryClass = pluginCategoryClass(category);
              return `
                <article class="card pluginInstallLine ${checked ? "selected" : ""}">
                  <span class="agentIcon">${pluginIconHtml(plugin)}</span>
                  <span class="pluginCopy">
                    <strong>${escapeHtml(pluginName(plugin))}</strong>
                    <span>${escapeHtml(pluginValueLine(plugin))}</span>
                    <span class="pluginStats">
                        <span class="pluginCategoryTag ${categoryClass}">${categoryIcon(category)} ${escapeHtml(categoryLabel(category))}</span>
                    </span>
                  </span>
                  <span class="pluginChoice">
                    <label>
                      <input data-plugin-install="${escapeHtml(plugin.id)}" aria-label="Enable ${escapeHtml(pluginName(plugin))}" title="${escapeHtml(plugin.settings?.runtimeError || "")}" type="checkbox" ${checked ? "checked" : ""} ${mandatory || plugin.settings?.runtimeAvailable === false ? "disabled" : ""}>
                      <span class="pluginAction" aria-hidden="true">
                        <span class="pluginActionIcon">${checked ? "✓" : "+"}</span>
                        <span class="pluginActionText">${plugin.settings?.runtimeAvailable === false ? "Unavailable" : mandatory ? "Required" : checked ? "Enabled" : "Enable"}</span>
                      </span>
                    </label>
                  </span>
                </article>
              `;
            }).join("") || `<div class="card empty">No safety or savings options match this filter.</div>`}
          </div>
        `;
      }

      function pluginSearchText(plugin) {
        return [
          pluginName(plugin),
          plugin.id,
          plugin.slug,
          plugin.name,
          plugin.description,
          pluginCategory(plugin),
          plugin.marketplace?.shortDescription,
          plugin.marketplace?.longDescription,
          ...(plugin.marketplace?.tags || []),
          ...(plugin.tags || [])
        ].filter(Boolean).join(" ").toLowerCase();
      }

      function pluginCategory(plugin) {
        const presentation = featurePresentation(plugin);
        if (presentation) return presentation.category;
        const raw = plugin.marketplace?.category || plugin.category || plugin.manifest?.category || "";
        const text = String(raw || `${plugin.id || ""} ${plugin.name || ""} ${plugin.description || ""} ${(plugin.marketplace?.tags || []).join(" ")} ${(plugin.tags || []).join(" ")}`).toLowerCase();
        if (/mcp-scanner|skill-scanner/.test(text)) return "protection";
        if (/security|policy|guard|skill|prompt-injection|risk|approval|dlp|leak|sensitive|secret|credential/.test(text)) return "protection";
        if (/visibility|observability|observe|log|mcp|siem|audit|telemetry|monitor/.test(text)) return "visibility";
        if (/cost|token|compression|usage|budget|spend/.test(text)) return "cost";
        return "other";
      }

      function pluginCategorySummary(plugins) {
        const counts = new Map([["all", plugins.length]]);
        for (const plugin of plugins) {
          const key = pluginCategory(plugin).toLowerCase();
          counts.set(key, (counts.get(key) || 0) + 1);
        }
        return [
          { id: "all", label: "All", count: counts.get("all") || 0 },
          { id: "protection", label: "Safety", count: counts.get("protection") || 0 },
          { id: "cost", label: "Cost control", count: counts.get("cost") || 0 },
          { id: "visibility", label: "Visibility", count: counts.get("visibility") || 0 },
          { id: "other", label: "Other", count: counts.get("other") || 0 }
        ].filter((item) => item.id === "all" || item.count > 0);
      }

      function pluginCategoryClass(category) {
        const normalized = String(category || "other").toLowerCase();
        if (normalized === "protection") return "security";
        if (normalized === "visibility") return "observability";
        if (normalized === "other") return "utility";
        return normalized;
      }

      function categoryIcon(category) {
        const normalized = String(category || "").toLowerCase();
        if (normalized === "security" || normalized === "protection" || normalized === "protections") {
          return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19 6v5.2c0 4.4-2.8 7.7-7 9.3-4.2-1.6-7-4.9-7-9.3V6z"></path></svg>`;
        }
        if (normalized === "observability" || normalized === "visibility") {
          return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.8 12s3.4-6 9.2-6 9.2 6 9.2 6-3.4 6-9.2 6-9.2-6-9.2-6z"></path><circle cx="12" cy="12" r="2.8"></circle></svg>`;
        }
        if (normalized === "utility" || normalized === "other") {
          return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-8 11h6l-1 9 9-12h-6z"></path></svg>`;
        }
        if (normalized === "all") {
          return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"></path></svg>`;
        }
        return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h5l2.5 10 2-7H20"></path></svg>`;
      }

      function metaIcon(kind) {
        if (kind === "downloads") {
          return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 20h14"></path></svg>`;
        }
        return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 20c1.1-4 3.3-6 6.5-6s5.4 2 6.5 6"></path></svg>`;
      }

      function setupPluginSettingsCards() {
        const plugins = (state.plugins || []).filter((plugin) => selectedPlugins?.has(plugin.id));
        if (plugins.length === 0) return `<div class="card empty">No Features selected. Leash will finish setup with core monitoring only.</div>`;
        return `
          <div class="pluginSettingsGrid">
            ${plugins.sort(comparePluginPopularity).map((plugin) => setupPluginSettingsCard(plugin)).join("")}
          </div>
        `;
      }

      function setupPluginSettingsCard(plugin) {
        const config = ensurePluginSetupConfig(plugin.id);
        return `
          <article class="card pluginSettingCard">
            <div class="fieldRow">
              <div>
                <strong>${escapeHtml(pluginName(plugin))}</strong>
                <p>${escapeHtml(pluginValueLine(plugin))}</p>
              </div>
              <span class="tag good">Leash</span>
            </div>
            <div class="pluginSettingFields">
              ${pluginSettingsFields(plugin, config)}
            </div>
          </article>
        `;
      }

      function pluginSettingsFields(plugin, config) {
        const fields = pluginSettingDefinitions(plugin, config).filter((field) => !isAdvancedOnlySetting(field.key));
        if (fields.length === 0) return `<p>No initial settings needed.</p>`;
        return fields.map((field) => pluginSettingField(plugin, config, field)).join("");
      }

      function pluginSettingDefinitions(plugin, config) {
        const properties = plugin.configSchema?.properties && typeof plugin.configSchema.properties === "object"
          ? plugin.configSchema.properties
          : {};
        const keys = new Set([
          ...Object.keys(plugin.defaultConfig || {}),
          ...Object.keys(config || {}),
          ...Object.keys(properties)
        ]);
        keys.delete("enabled");
        return [...keys].sort().map((key) => ({
          key,
          schema: properties[key] && typeof properties[key] === "object" ? properties[key] : {},
          defaultValue: plugin.defaultConfig?.[key]
        }));
      }

      const advancedOnlySettingKeys = new Set(["model", "minimumChars", "protectRecent", "ccrEnabled", "ccrTtlSeconds", "policySet"]);
      const advancedExactSettingKeys = new Set(["notificationRiskThreshold", "suspiciousRiskThreshold", "minimumCodeCharacters"]);

      function isAdvancedOnlySetting(key) {
        return advancedOnlySettingKeys.has(key);
      }

      function hasAdvancedExactControl(key) {
        return advancedExactSettingKeys.has(key);
      }

      function pluginSettingField(plugin, config, field) {
        const value = config[field.key] ?? field.defaultValue;
        const schema = field.schema || {};
        const label = settingLabel(field.key);
        const numberOptions = friendlyNumberOptions(field.key);
        if (numberOptions.length) {
          return `
            <div class="fieldRow">
              <strong>${escapeHtml(label)}</strong>
              <select data-plugin-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" data-setting-kind="number-choice">
                ${numberOptions.map((option) => `<option value="${option.value}" ${Number(value) === option.value ? "selected" : ""}>${escapeHtml(option.label)}</option>`).join("")}
              </select>
            </div>
          `;
        }
        if (Array.isArray(schema.enum)) {
          return `
            <div class="fieldRow">
              <strong>${escapeHtml(label)}</strong>
              <select data-plugin-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}">
                ${schema.enum.map((option) => `<option value="${escapeHtml(option)}" ${String(value) === String(option) ? "selected" : ""}>${escapeHtml(settingLabel(option))}</option>`).join("")}
              </select>
            </div>
          `;
        }
        if (schema.type === "array" && Array.isArray(schema.items?.enum)) {
          const selected = Array.isArray(value) ? value.map(String) : [];
          return `
            <div>
              <strong>${escapeHtml(label)}</strong>
              <div class="checkboxGrid" style="margin-top:10px">
                ${schema.items.enum.map((option) => `
                  <label class="checkboxPill">
                    <input data-plugin-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" data-setting-kind="array" value="${escapeHtml(option)}" type="checkbox" ${selected.includes(String(option)) ? "checked" : ""}>
                    ${escapeHtml(settingLabel(option))}
                  </label>
                `).join("")}
              </div>
            </div>
          `;
        }
        if (plugin.id === "openleash.rules-enforcer" && field.key === "rules") {
          const rulesText = normalizeRuleEditorValues(value).map((rule) => rule.text).join("\n");
          return `
            <div>
              <strong>${escapeHtml(label)}</strong>
              <textarea class="detailSettingInput" style="margin-top:10px; width:100%" data-plugin-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" data-setting-kind="string-array">${escapeHtml(rulesText)}</textarea>
            </div>
          `;
        }
        if ((schema.type === "array" && schema.items?.type === "string") || isStringArraySetting(value) || field.key === "rules") {
          return `
            <div>
              <strong>${escapeHtml(label)}</strong>
              <textarea class="detailSettingInput" style="margin-top:10px; width:100%" data-plugin-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" data-setting-kind="string-array">${escapeHtml(Array.isArray(value) ? value.join("\n") : String(value ?? ""))}</textarea>
            </div>
          `;
        }
        if (schema.type === "boolean" || typeof value === "boolean") {
          return `
            <label class="fieldRow">
              <span><strong>${escapeHtml(label)}</strong></span>
              <span class="switch"><input data-plugin-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" type="checkbox" ${value ? "checked" : ""}><span></span></span>
            </label>
          `;
        }
        if (schema.type === "number" || schema.type === "integer" || typeof value === "number") {
          return `
            <div class="fieldRow">
              <strong>${escapeHtml(label)}</strong>
              <input data-plugin-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" type="number" value="${escapeHtml(value ?? 0)}">
            </div>
          `;
        }
        return `
          <div class="fieldRow">
            <strong>${escapeHtml(label)}</strong>
            <input data-plugin-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" value="${escapeHtml(value ?? "")}">
          </div>
        `;
      }

      function settingLabel(value) {
        const labels = {
          action: "If AI tries to share private information",
          categories: "What should Leash keep private?",
          destructiveAction: "Deleting or destroying things",
          databaseMutationAction: "Changing your database",
          broadFilesystemAction: "Changing lots of files at once",
          secretFileAction: "Opening password or sign-in files",
          envDumpAction: "Showing saved passwords or access keys",
          exfiltrationAction: "Sending private information somewhere else",
          suspiciousRiskThreshold: "How cautious should Leash be?",
          notificationRiskThreshold: "When should Leash warn you?",
          minimumCodeCharacters: "Which code changes should Leash check?",
          redactSecrets: "Hide private values in Leash history",
          rules: "Your rules",
          level: "How much should Leash save?",
          conciseResponse: "Ask AI for shorter answers",
          pii: "Personal information",
          phi: "Health information",
          tokens: "Sign-in codes",
          keys: "Computer access keys",
          credentials: "Passwords and sign-in details",
          allow: "Let it continue",
          ask: "Ask me first",
          block: "Stop it",
          light: "Save a little",
          standard: "Balanced",
          maximum: "Save the most"
        };
        if (labels[value]) return labels[value];
        return String(value || "")
          .replace(/[_-]+/g, " ")
          .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
          .trim()
          .replace(/\b\w/g, (char) => char.toUpperCase());
      }

      /* development-plugin-selection:start */
      function isDevelopmentDesktopRenderer(pathname = window.location.pathname) {
        const normalized = decodeURIComponent(String(pathname || "")).replace(/\\/g, "/");
        return normalized.includes("/apps/desktop/.dev/")
          || normalized.endsWith("/apps/desktop/dist/window.html");
      }

      function defaultPluginSelectionIds(plugins) {
        return (plugins || [])
          .filter((plugin) => plugin?.settings?.runtimeAvailable !== false)
          .map((plugin) => plugin.id)
          .filter(Boolean);
      }
      /* development-plugin-selection:end */

      function enableEverySetupFeature() {
        selectedPlugins = new Set(defaultPluginSelectionIds(state.plugins));
        for (const plugin of state.plugins || []) {
          ensurePluginSetupConfig(plugin.id).enabled = selectedPlugins.has(plugin.id);
        }
      }

      function bindPluginSelection() {
        root.querySelectorAll("[data-plugin-install]").forEach((input) => {
          const label = input.closest("label");
          if (label) {
            label.onclick = (event) => {
              event.preventDefault();
              setPluginSelected(input, !input.checked, true);
            };
          };
          input.onchange = () => setPluginSelected(input, input.checked, true);
        });
      }

      function bindDevelopmentPluginSelection() {
        const button = document.getElementById("addAllDevelopmentPlugins");
        if (!button || !isDevelopmentDesktopRenderer()) return;
        button.onclick = () => {
          pluginSelectionTouched = true;
          selectedPlugins = new Set(defaultPluginSelectionIds(state.plugins));
          for (const plugin of state.plugins || []) {
            ensurePluginSetupConfig(plugin.id).enabled = selectedPlugins.has(plugin.id);
          }
          renderSetup();
        };
      }

      function setPluginSelected(input, checked, flash = false) {
        if (!selectedPlugins) selectedPlugins = new Set();
        pluginSelectionTouched = true;
        const pluginId = input.dataset.pluginInstall;
        if (!pluginId) return;
        const plugin = (state.plugins || []).find((item) => item.id === pluginId);
        if (plugin?.organizationPolicy?.mandatory) {
          input.checked = true;
          selectedPlugins.add(pluginId);
          return;
        }
        input.checked = Boolean(checked);
        input.checked ? selectedPlugins.add(pluginId) : selectedPlugins.delete(pluginId);
        ensurePluginSetupConfig(pluginId).enabled = Boolean(input.checked);
        const actionIcon = input.parentElement?.querySelector(".pluginActionIcon");
        const actionText = input.parentElement?.querySelector(".pluginActionText");
        if (actionIcon) actionIcon.textContent = input.checked ? "✓" : "+";
        if (actionText) actionText.textContent = input.checked ? "Enabled" : "Enable";
        const card = input.closest(".pluginInstallLine");
        card?.classList.toggle("selected", Boolean(input.checked));
        if (flash && card) {
          card.classList.add("justChanged");
          setTimeout(() => {
            card.classList.remove("justChanged");
            if (actionText) actionText.textContent = input.checked ? "Enabled" : "Enable";
          }, 650);
        } else if (actionText) {
          actionText.textContent = input.checked ? "Enabled" : "Enable";
        }
      }

      function bindPluginMarketplaceSearch(target = "setup") {
        const search = document.getElementById("pluginMarketplaceSearch");
        if (search) {
          search.oninput = () => {
            setupPluginSearch = search.value;
            target === "marketplace" ? renderPluginMarketplace() : renderSetup();
            const nextSearch = document.getElementById("pluginMarketplaceSearch");
            if (nextSearch) {
              nextSearch.focus();
              nextSearch.setSelectionRange(nextSearch.value.length, nextSearch.value.length);
            }
          };
        };
        root.querySelectorAll("[data-plugin-category]").forEach((button) => {
          button.onclick = () => {
            setupPluginCategory = button.dataset.pluginCategory || "all";
            target === "marketplace" ? renderPluginMarketplace() : renderSetup();
          };
        });
        root.querySelectorAll("[data-add-local-plugin-folder]").forEach((button) => {
          button.onclick = async () => {
            button.disabled = true;
            const original = button.textContent;
            button.textContent = "Adding...";
            const result = await window.openleash.importLocalPluginFolder?.().catch((error) => ({ ok: false, error: error?.message || "Could not add local Feature." }));
            button.disabled = false;
            button.textContent = original || "Add/reload local folder";
            if (result?.canceled) return;
            if (!result?.ok) {
              alert(result?.error || "Could not add local Feature.");
              return;
            }
            if (result.runtimeStatus && !result.runtimeStatus.healthy) {
              alert(`Feature saved, but it is not ready: ${result.runtimeStatus.error || "health check failed"}`);
            } else {
              alert(`${pluginName(result.plugin || { id: result.pluginId })} loaded. Choose this folder again after rebuilding to reload it.`);
            }
            if (result.plugin && !state.plugins?.some((plugin) => plugin.id === result.plugin.id)) {
              state.plugins = [...(state.plugins || []), {
                ...result.plugin,
                marketplace: result.plugin,
                settings: result.settings || { enabled: true, config: result.plugin.defaultConfig || {}, availableVersion: result.plugin.version },
                organizationPolicy: { mandatory: false, defaultEnabled: false, userInstallAllowed: true, configLocked: false }
              }];
            }
            initializePluginSetupState(true);
            target === "marketplace" ? renderPluginMarketplace() : renderSetup();
          };
        });
      }

      function canAddLocalPluginFolder() {
        return false;
      }

      function bindPluginSettingInputs() {
        root.querySelectorAll("[data-plugin-setting]").forEach((input) => {
          input.onchange = () => updatePluginSettingFromInput(input);
          input.oninput = () => updatePluginSettingFromInput(input);
        });
      }

      function updatePluginSettingFromInput(input) {
        const pluginId = input.dataset.pluginSetting;
        const key = input.dataset.settingKey;
        if (!pluginId || !key) return;
        const config = ensurePluginSetupConfig(pluginId);
        if (input.dataset.settingKind === "array") {
          config[key] = [...root.querySelectorAll(`[data-plugin-setting="${cssEscape(pluginId)}"][data-setting-key="${cssEscape(key)}"]:checked`)].map((item) => item.value);
          return;
        }
        if (input.dataset.settingKind === "string-array") {
          config[key] = String(input.value || "")
            .split(/\r?\n/g)
            .map((line) => line.replace(/^[-*]\s+/, "").trim())
            .filter(Boolean);
          return;
        }
        if (input.dataset.settingKind === "number-choice") {
          config[key] = Number(input.value || 0);
          return;
        }
        if (input.type === "checkbox") {
          config[key] = Boolean(input.checked);
          return;
        }
        if (input.type === "number") {
          config[key] = Math.max(0, Math.min(100, Number(input.value || 0)));
          return;
        }
        config[key] = input.value;
      }

      function selectedPluginSettingsPayloads() {
        return (state.plugins || []).map((plugin) => {
          const enabled = Boolean(plugin.organizationPolicy?.mandatory || selectedPlugins?.has(plugin.id));
          return {
            pluginId: plugin.id,
            enabled,
            ...(enabled ? {
              config: {
                ...(plugin.defaultConfig || {}),
                ...(plugin.settings?.config || {}),
                ...ensurePluginSetupConfig(plugin.id),
                enabled
              },
              orderingPriority: plugin.settings?.orderingPriority ?? plugin.ordering?.priority ?? null
            } : {}),
            marketplace: plugin.marketplace || null
          };
        });
      }

      async function saveSelectedPluginSettings() {
        const payloads = selectedPluginSettingsPayloads();
        if (payloads.length === 0) return { ok: true };
        if (!setupRemoteAuth?.token && !canAddLocalPluginFolder()) return { ok: true };
        const updated = [];
        for (const payload of payloads) {
          const result = await window.openleash.savePluginSettings({
            apiUrl: setupRemoteApiUrl,
            token: setupRemoteAuth?.token,
            ...payload
          }).catch((error) => ({ ok: false, error: error?.message || "Could not save Feature settings." }));
          if (!result?.ok) return { ok: false, error: result?.error || `Could not save ${featureNameFromIdentifier(payload.pluginId)}.`, pluginId: payload.pluginId };
          updated.push(result);
        }
        const settingsById = new Map(updated.map((item) => [item.pluginId, item.settings]));
        state.plugins = (state.plugins || []).map((plugin) => ({
          ...plugin,
          settings: settingsById.get(plugin.id) || plugin.settings
        }));
        initializePluginSetupState(true);
        return { ok: true };
      }
