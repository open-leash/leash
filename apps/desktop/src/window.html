        const filtered = (state.viewModel?.pluginCategories ? viewPlugins.map(clientPluginCatalogItem) : viewPlugins).filter(Boolean);

        root.innerHTML = `

              <div class="actions">
                <span id="pluginDetailSaveStatus" class="detailSettingStatus"></span>
                <button id="savePluginDetailSettings" class="primary" ${locked || !installed ? "disabled" : ""}>Save settings</button>
              </div>
            </section>
            ` : ""}
          </div>
        `;
        document.getElementById("backPlugins").onclick = () => {
          view = installed ? "plugins" : "plugin-marketplace";
          renderView();
        };
        root.querySelectorAll("[data-plugin-detail-tab]").forEach((button) => {
          button.onclick = () => {
            pluginDetailTab = button.dataset.pluginDetailTab || "insights";
            renderPluginDetail();
          };
        });
        root.querySelectorAll("[data-plugin-history-outcome]").forEach((card) => {
          const open = () => {
            selectedEventId = card.dataset.pluginHistoryOutcome || "";
            eventReturnView = "plugin-detail";
            markHistoryRead(selectedEventId);
            view = "event";
            renderView();
          };
          card.onclick = open;
          card.onkeydown = (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              open();
            }
          };
        });
        const toggleInstall = document.getElementById("togglePluginInstall");
        if (toggleInstall && !mandatory) {
          toggleInstall.onclick = async () => {
            if (installed && !confirm(`Turn off ${pluginName(plugin)} for this account?`)) return;
            toggleInstall.disabled = true;
            toggleInstall.classList.add("busy");
            const stateLabel = toggleInstall.querySelector("[data-feature-state]");
            if (stateLabel) stateLabel.textContent = installed ? "Turning off…" : "Turning on…";
            const result = await window.openleash.savePluginSettings({
              pluginId: plugin.id,
              enabled: !installed,
              config: effectivePluginConfig(plugin),
              orderingPriority: plugin.settings?.orderingPriority ?? plugin.ordering?.priority ?? null,
              marketplace: plugin.marketplace || null
            }).catch((error) => ({ ok: false, error: error?.message || "Could not update Feature." }));
            if (!result?.ok) {
              const status = document.getElementById("pluginDetailSaveStatus") || document.getElementById("pluginDetailPageStatus");
              if (status) status.textContent = result?.error || "Could not update Feature.";
              toggleInstall.disabled = false;
              toggleInstall.classList.remove("busy");
              if (stateLabel) stateLabel.textContent = installed ? "Enabled" : "Disabled";
              return;
            }
            state.plugins = (state.plugins || []).map((item) => item.id === plugin.id
              ? { ...item, settings: result.settings || { ...(item.settings || {}), enabled: !installed } }
              : item
            );
            pluginDetailTab = !installed ? "insights" : "settings";
            renderPluginDetail();
          };
        }
        if (pluginDetailTab === "settings") bindPluginDetailSettings(plugin);
      }

      function renderPluginRuleImport() {
        const plugin = (state.plugins || []).find((item) => item.id === selectedPluginId);
        if (!plugin || !pendingRuleImport || pendingRuleImport.pluginId !== selectedPluginId) {
          view = "plugin-detail";
          return renderPluginDetail();
        }
        const candidates = pendingRuleImport.candidates || [];
        const selectedCount = candidates.filter((candidate) => pendingRuleImport.selected.has(candidate.id)).length;
        const groups = ruleCandidateGroups(candidates);
        root.innerHTML = `
          <div class="head">
            <div>
              <button id="backPluginDetailFromImport" class="secondary">Back</button>
              <h1>Import instruction rules</h1>
              <p>Select the rules Leash should enforce from scanned agent instruction files.</p>
            </div>
            <span class="tag good">${escapeHtml(String(selectedCount))} selected</span>
          </div>
          <div class="card ruleImportReview">
            <div class="fieldRow">
              <div>
                <strong>${escapeHtml(candidates.length)} candidate rules</strong>
                <p>Found across ${escapeHtml(String(pendingRuleImport.sourceCount || 0))} instruction file${pendingRuleImport.sourceCount === 1 ? "" : "s"}. Imported rules are added as unsaved settings until you press Save settings.</p>
              </div>
              <div class="actions">
                <button type="button" class="secondary" id="selectAllRuleCandidates">Select all</button>
                <button type="button" class="secondary" id="selectNoRuleCandidates">Select none</button>
              </div>
            </div>
            <div class="ruleCandidateList">
              ${groups.map((group) => `
                <section class="ruleCandidateGroup">
                  <div class="ruleCandidateGroupHead">
                    <span class="agentIcon">${agentIcon({ displayName: group.agent, icon: iconNameForAgent(group.agent) })}</span>
                    <span>
                      <strong>${escapeHtml(group.agent)}</strong>
                      <small>${escapeHtml(group.label)}${group.path ? ` · ${escapeHtml(shortPath(group.path))}` : ""}</small>
                    </span>
                    <em>${escapeHtml(String(group.rules.length))} rules</em>
                  </div>
                  <div class="ruleCandidateRows">
                    ${group.rules.map((candidate) => `
                      <label class="ruleCandidateRow ${pendingRuleImport.selected.has(candidate.id) ? "selected" : ""}">
                        <input type="checkbox" data-rule-candidate="${escapeHtml(candidate.id)}" ${pendingRuleImport.selected.has(candidate.id) ? "checked" : ""}>
                        <span>
                          <strong>${escapeHtml(candidate.text)}</strong>
                          <small>${escapeHtml(candidate.scope || "instruction file")}</small>
                        </span>
                        <select data-rule-candidate-action="${escapeHtml(candidate.id)}">
                          <option value="ask" ${candidate.action !== "block" ? "selected" : ""}>Ask</option>
                          <option value="block" ${candidate.action === "block" ? "selected" : ""}>Block</option>
                        </select>
                      </label>
                    `).join("")}
                  </div>
                </section>
              `).join("") || `<div class="empty">No instruction rules found.</div>`}
            </div>
            <div class="actions">
              <span id="ruleImportReviewStatus" class="detailSettingStatus"></span>
              <button type="button" class="secondary" id="cancelRuleImportReview">Cancel</button>
              <button type="button" class="primary" id="importSelectedRuleCandidates" ${selectedCount === 0 ? "disabled" : ""}>Next</button>
            </div>
          </div>
        `;
        bindPluginRuleImport(plugin);
      }

      function ruleCandidateGroups(candidates) {
        const groups = new Map();
        for (const candidate of candidates || []) {
          const key = [candidate.agent || "Agent instructions", candidate.path || candidate.label || ""].join("|");
          if (!groups.has(key)) {
            groups.set(key, {
              agent: candidate.agent || "Agent instructions",
              label: candidate.label || "Instruction file",
              path: candidate.path || "",
              rules: []
            });
          }
          groups.get(key).rules.push(candidate);
        }
        return [...groups.values()];
      }

      function shortPath(value) {
        const text = String(value || "").replace(/\\/g, "/");
        return text.replace(/^.*?([^/]+\/[^/]+\/[^/]+)$/, "$1");
      }

      function bindPluginRuleImport(plugin) {
        document.getElementById("backPluginDetailFromImport").onclick = () => {
          view = "plugin-detail";
          renderView();
        };
        document.getElementById("cancelRuleImportReview").onclick = () => {
          pendingRuleImport = null;
          view = "plugin-detail";
          renderView();
        };
        document.getElementById("selectAllRuleCandidates").onclick = () => {
          pendingRuleImport.selected = new Set((pendingRuleImport.candidates || []).map((candidate) => candidate.id));
          renderPluginRuleImport();
        };
        document.getElementById("selectNoRuleCandidates").onclick = () => {
          pendingRuleImport.selected = new Set();
          renderPluginRuleImport();
        };
        root.querySelectorAll("[data-rule-candidate]").forEach((input) => {
          input.onchange = () => {
            input.checked ? pendingRuleImport.selected.add(input.dataset.ruleCandidate) : pendingRuleImport.selected.delete(input.dataset.ruleCandidate);
            renderPluginRuleImport();
          };
        });
        root.querySelectorAll("[data-rule-candidate-action]").forEach((select) => {
          select.onchange = () => {
            const candidate = (pendingRuleImport.candidates || []).find((item) => item.id === select.dataset.ruleCandidateAction);
            if (candidate) candidate.action = select.value === "block" ? "block" : "ask";
          };
        });
        document.getElementById("importSelectedRuleCandidates").onclick = () => {
          const selected = (pendingRuleImport.candidates || [])
            .filter((candidate) => pendingRuleImport.selected.has(candidate.id))
            .map((candidate) => ({ text: candidate.text, action: candidate.action === "block" ? "block" : "ask" }));
          addRulesToPluginDraft(plugin, selected);
          pendingRuleImport = null;
          view = "plugin-detail";
          renderView();
        };
      }

      function bindPluginPageControls() {
        root.querySelectorAll("[data-open-plugin]").forEach((card) => {
          card.onclick = () => {
            selectedPluginId = card.dataset.openPlugin || "";
            const plugin = (state.plugins || []).find((item) => item.id === selectedPluginId);
            pluginViewCategory = plugin ? pluginCategory(plugin).toLowerCase() : pluginViewCategory;
            view = "plugin-detail";
            renderView();
          };
        });
      }

      function pluginOutcomes(pluginId) {
        return (state.outcomes || [])
          .filter((outcome) => outcome?.source?.pluginId === pluginId)
          .sort((a, b) => new Date(b.occurredAt || b.createdAt || 0) - new Date(a.occurredAt || a.createdAt || 0));
      }

      function pluginOutcomeCard(outcome) {
        const severity = String(outcome.severity || "info").toLowerCase();
        const statusClass = severity === "critical" || severity === "high" || outcome.status === "blocked" ? "bad" : outcome.status === "resolved" || outcome.status === "allowed" ? "good" : "";
        const agentName = outcome.agent?.name || outcome.agent?.kind || "AI agent";
        const context = [outcome.context?.toolName, outcome.context?.projectPath ? projectTag(outcome.context.projectPath) : ""].filter(Boolean).join(" · ");
        const when = outcome.occurredAt || outcome.createdAt;
        const evidence = (outcome.evidence || []).find((item) => item?.value)?.value || "";
        return `
          <button type="button" class="pluginAuditRow pluginHistoryCard" data-plugin-history-outcome="${escapeHtml(outcome.id)}">
            <span class="pluginAuditTime"><strong>${escapeHtml(humanTimestamp(when))}</strong><small>${escapeHtml(friendlyExactTimestamp(when))}</small></span>
            <span class="pluginAuditAgent"><span class="agentIcon">${agentIcon({ displayName: agentName, icon: iconNameForAgent(agentName), kind: outcome.agent?.kind })}</span><strong>${escapeHtml(agentName)}</strong></span>
            <span class="pluginAuditAction"><strong>${escapeHtml(outcome.title || "Monitored action")}</strong><small>${escapeHtml(outcome.summary || context || evidence || "Recorded by Leash")}</small></span>
            <span class="tag ${statusClass}">${escapeHtml(outcome.status || severity)}</span>
            <span class="historyChevron">›</span>
          </button>
        `;
      }

      function pluginOutcomeHistoryItem(outcome) {
        const decision = String(outcome.decision || outcome.status || "allow").toLowerCase();
        const resolution = /block|stop|deny/.test(decision) ? "deny" : /ask|question|review|waiting|pending/.test(decision) ? "ask" : "allow";
        return {
          id: outcome.id,
          summary: outcome.title || "Leash checked an agent action",
          question: outcome.summary || "Leash recorded this agent action so you can understand what happened.",
          resolution,
          decision: resolution,
          agent_name: outcome.agent?.name || outcome.agent?.kind || "AI agent",
          hostname: outcome.agent?.hostname || "This computer",
          project_path: outcome.context?.projectPath || outcome.subject?.name || "",
          tool_name: outcome.context?.toolName || "",
          event_name: outcome.context?.eventName || "",
          created_at: outcome.occurredAt || outcome.createdAt,
          triggered_policies: (outcome.evidence || []).map((item) => ({
            policy_name: item.label || "What Leash noticed",
            explanation: item.value || "Recorded"
          })),
          payload: {
            ...(outcome.details || {}),
            protection: outcome.source?.label || outcome.source?.pluginId || "Leash protection",
            subject: outcome.subject || null,
            evidence: outcome.evidence || []
          }
        };
      }

      function pluginDetailSettingsFields(plugin) {
        const config = effectivePluginConfig(plugin);
        const fields = pluginSettingDefinitions(plugin, config);
        if (fields.length === 0) return `<div class="empty">No settings exposed.</div>`;
        const basic = fields.filter((field) => !isAdvancedOnlySetting(field.key));
        const advanced = fields.filter((field) => isAdvancedOnlySetting(field.key) || hasAdvancedExactControl(field.key));
        return `
          ${basic.map((field) => pluginDetailSettingField(plugin, config, field)).join("")}
          ${advanced.length ? `
            <details class="advancedSettings">
              <summary>Advanced settings</summary>
              <p>Exact controls for people who want to tune how Leash works. The recommended values are safe to keep.</p>
              <div class="pluginDetailSettings">
                ${advanced.map((field) => pluginDetailSettingField(plugin, config, field, true)).join("")}
              </div>
            </details>
          ` : ""}
        `;
      }

      const profileAgentKinds = [
        "codex", "claude-code", "cursor", "github-copilot", "gemini", "opencode",
        "cline", "continue", "windsurf", "kiro", "aider", "zed", "openclaw",
        "nanoclaw", "salesforce-agentforce", "azure-ai-foundry", "microsoft-copilot-studio",
        "aws-bedrock-agentcore", "google-vertex-ai", "n8n", "zapier-agents",
        "openai-codex-cloud", "unknown"
      ];

      function pluginProfileSettings(plugin, disabled) {
        const inherited = plugin.settings?.inheritedProfiles || [];
        const profiles = plugin.settings?.profiles || [];
        const rulesEnforcer = plugin.id === "openleash.rules-enforcer";
        return `
          <div class="pluginDetailHeader" style="margin-top:24px">
            <div><strong>${rulesEnforcer ? "Rules by project or agent" : "Agent-specific settings"}</strong><p>${rulesEnforcer ? "Project rules are usually the easiest choice. Select a detected project path or enter one yourself; use agent rules when a rule should follow an agent everywhere." : "Choose different Feature behavior for an agent type or one enrolled agent."}</p></div>
            ${disabled ? "" : rulesEnforcer
              ? `<div class="ruleListActions"><button type="button" class="secondary" id="addProjectPluginProfile">Add project rules</button><button type="button" class="secondary" id="addAgentPluginProfile">Add agent rules</button></div>`
              : `<button type="button" class="secondary" id="addPluginProfile">Add profile</button>`}
          </div>
          ${inherited.length ? `<div class="empty" style="margin-top:12px">${escapeHtml(String(inherited.length))} organization profile${inherited.length === 1 ? "" : "s"} will apply before your profiles.</div>` : ""}
          <div class="cardList" id="pluginProfileList" style="margin-top:12px">
            ${profiles.map((profile) => pluginProfileCard(plugin, profile, disabled)).join("") || `<div class="empty">${rulesEnforcer ? "No project or agent rule sets yet. Base rules apply everywhere." : "No agent-specific overrides."}</div>`}
          </div>
        `;
      }

      function pluginProfileCard(plugin, profile, disabled) {
        const safeId = escapeHtml(profile.id);
        const knownAgents = (state.agents || []).filter((agent) => agent.id || agent.instanceId);
        const rulesEnforcer = plugin.id === "openleash.rules-enforcer";
        const projectScoped = rulesEnforcer && Array.isArray(profile.projectPaths);
        const projects = detectedProjectPaths();
        const detectedPaths = new Set(projects.map((project) => project.path));
        const manualPaths = (profile.projectPaths || []).filter((projectPath) => projectPath && !detectedPaths.has(normalizeProjectScopePath(projectPath)));
        return `
          <article class="card" data-plugin-profile="${safeId}" data-profile-scope="${projectScoped ? "project" : "agent"}">
            <div class="fieldRow">
              <label><strong>Profile name</strong><input class="detailSettingInput" data-profile-name value="${escapeHtml(profile.name || profile.id)}" ${disabled ? "disabled" : ""}></label>
              ${rulesEnforcer ? `<span class="tag">${projectScoped ? "Project rules" : "Agent rules"}</span>` : ""}
              ${disabled ? "" : `<button type="button" class="secondary" data-remove-plugin-profile="${safeId}">Remove</button>`}
            </div>
            <div class="fieldRow" style="margin-top:12px">
              ${projectScoped ? `
                <label><strong>Detected projects</strong><select class="detailSettingInput" data-profile-project-paths multiple size="${Math.max(3, Math.min(6, projects.length || 3))}" ${disabled ? "disabled" : ""}>${projects.map((project) => `<option value="${escapeHtml(project.path)}" ${(profile.projectPaths || []).map(normalizeProjectScopePath).includes(project.path) ? "selected" : ""}>${escapeHtml(project.name)} — ${escapeHtml(project.path)}</option>`).join("")}</select><small>${projects.length ? "Select one or more projects Leash has seen." : "No projects detected yet; add a path below."}</small></label>
                <label><strong>Add project paths manually</strong><textarea class="detailSettingInput" data-profile-manual-project-paths placeholder="/Users/you/Code/my-project" ${disabled ? "disabled" : ""}>${escapeHtml(manualPaths.join("\n"))}</textarea><small>One project root per line. Work inside subfolders also matches.</small></label>
              ` : `
                <label><strong>Agent types</strong><select class="detailSettingInput" data-profile-agent-kinds multiple size="5" ${disabled ? "disabled" : ""}>${profileAgentKinds.map((kind) => `<option value="${kind}" ${(profile.agentKinds || []).includes(kind) ? "selected" : ""}>${escapeHtml(settingLabel(kind))}</option>`).join("")}</select><small>No selection means every agent type.</small></label>
                <label><strong>Exact enrolled agents (optional)</strong><select class="detailSettingInput" data-profile-agent-ids multiple size="5" ${disabled ? "disabled" : ""}>${knownAgents.map((agent) => { const id = String(agent.instanceId || agent.id); return `<option value="${escapeHtml(id)}" ${(profile.agentIds || []).includes(id) ? "selected" : ""}>${escapeHtml(agent.displayName || agent.name || id)}</option>`; }).join("")}</select></label>
              `}
              <label><strong>Feature status</strong><select class="detailSettingInput" data-profile-enabled ${disabled || plugin.organizationPolicy?.mandatory ? "disabled" : ""}><option value="inherit" ${plugin.organizationPolicy?.mandatory || typeof profile.enabled !== "boolean" ? "selected" : ""}>${plugin.organizationPolicy?.mandatory ? "Required by organization" : "Use main Feature setting"}</option><option value="true" ${!plugin.organizationPolicy?.mandatory && profile.enabled === true ? "selected" : ""}>On</option><option value="false" ${!plugin.organizationPolicy?.mandatory && profile.enabled === false ? "selected" : ""}>Off</option></select></label>
              <label><strong>Priority</strong><input class="detailSettingInput" data-profile-priority type="number" value="${escapeHtml(String(profile.priority ?? 0))}" ${disabled ? "disabled" : ""}></label>
            </div>
            ${rulesEnforcer
              ? `<label style="display:block;margin-top:12px"><strong>Rules for this ${projectScoped ? "project" : "agent"} scope</strong><textarea class="detailSettingInput" data-profile-rules placeholder="ask: Ask before changing dependencies\nblock: Never commit secrets" ${disabled ? "disabled" : ""}>${escapeHtml(formatScopedRules(profile.config?.rules))}</textarea><small>One rule per line. Prefix with ask: or block:.</small></label>`
              : `<label style="display:block;margin-top:12px"><strong>Setting overrides (JSON)</strong><textarea class="detailSettingInput" data-profile-config ${disabled ? "disabled" : ""}>${escapeHtml(JSON.stringify(profile.config || {}, null, 2))}</textarea></label>`}
          </article>
        `;
      }

      function collectPluginProfiles(plugin) {
        return [...root.querySelectorAll("[data-plugin-profile]")].map((card, index) => {
          const enabledValue = card.querySelector("[data-profile-enabled]")?.value;
          let config = {};
          try {
            config = plugin.id === "openleash.rules-enforcer"
              ? { rules: parseScopedRules(card.querySelector("[data-profile-rules]")?.value || "") }
              : JSON.parse(card.querySelector("[data-profile-config]")?.value || "{}");
          }
          catch { throw new Error(`Profile ${index + 1} has invalid settings JSON.`); }
          const projectScoped = card.dataset.profileScope === "project";
          const projectPaths = projectScoped ? [...new Set([
            ...(card.querySelector("[data-profile-project-paths]")?.selectedOptions || []),
          ].map((option) => normalizeProjectScopePath(option.value)).concat(
            String(card.querySelector("[data-profile-manual-project-paths]")?.value || "").split(/\r?\n/g).map(normalizeProjectScopePath)
          ).filter(Boolean))] : [];
          if (projectScoped && projectPaths.length === 0) throw new Error(`Profile ${index + 1} needs at least one project path.`);
          return {
            id: card.dataset.pluginProfile,
            name: card.querySelector("[data-profile-name]")?.value || card.dataset.pluginProfile,
            agentKinds: [...(card.querySelector("[data-profile-agent-kinds]")?.selectedOptions || [])].map((option) => option.value),
            agentIds: [...(card.querySelector("[data-profile-agent-ids]")?.selectedOptions || [])].map((option) => option.value),
            ...(projectScoped ? { projectPaths } : {}),
            ...(enabledValue === "true" ? { enabled: true } : enabledValue === "false" ? { enabled: false } : {}),
            config,
            priority: Number(card.querySelector("[data-profile-priority]")?.value || 0)
          };
        });
      }

      function formatScopedRules(value) {
        return normalizeRuleEditorValues(value).map((rule) => `${rule.action === "block" ? "block" : "ask"}: ${rule.text}`).join("\n");
      }

      function parseScopedRules(value) {
        return String(value || "").split(/\r?\n/g).map((line) => {
          const trimmed = line.trim();
          const match = trimmed.match(/^(ask|block)\s*:\s*(.+)$/i);
          return { text: (match?.[2] || trimmed).trim(), action: match?.[1]?.toLowerCase() === "block" ? "block" : "ask" };
        }).filter((rule) => rule.text);
      }

      function pluginDetailSettingField(plugin, config, field, advanced = false) {
        const value = config[field.key] ?? field.defaultValue;
        const schema = field.schema || {};
        const disabled = plugin.organizationPolicy?.configLocked ? "disabled" : "";
        const label = advanced ? advancedSettingLabel(field.key) : settingLabel(field.key);
        const hint = advanced ? advancedSettingHint(field.key) : pluginSettingHint(field.key);
        const head = `
          <div class="pluginDetailSettingHead">
            <strong>${escapeHtml(label)}</strong>
            ${hint ? `<small>${escapeHtml(hint)}</small>` : ""}
          </div>
        `;
        if (isProtectionActionSetting(field.key, schema.enum, value)) {
          const action = normalizeProtectionAction(value);
          return `
            <div class="pluginDetailSetting">
              ${head}
              <div class="protectionResponseSlider" data-level="${action}">
                ${["allow", "ask", "block"].map((option) => `
                  <label>
                    <input data-plugin-detail-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" type="radio" name="plugin-detail-${escapeHtml(plugin.id)}-${escapeHtml(field.key)}" value="${option}" ${action === option ? "checked" : ""} ${disabled}>
                    <span>${escapeHtml(settingLabel(option))}</span>
                  </label>
                `).join("")}
              </div>
            </div>
          `;
        }
        const numberOptions = advanced ? [] : friendlyNumberOptions(field.key);
        if (numberOptions.length) {
          return `
            <div class="pluginDetailSetting">
              ${head}
              <div class="segmented" style="grid-template-columns: repeat(${numberOptions.length}, minmax(0, 1fr))">
                ${numberOptions.map((option) => `
                  <label>
                    <input data-plugin-detail-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" data-setting-kind="number-choice" type="radio" name="plugin-detail-${escapeHtml(plugin.id)}-${escapeHtml(field.key)}" value="${option.value}" ${Number(value) === option.value ? "checked" : ""} ${disabled}>
                    ${escapeHtml(option.label)}
                  </label>
                `).join("")}
              </div>
            </div>
          `;
        }
        if (Array.isArray(schema.enum)) {
          return `
            <div class="pluginDetailSetting">
              ${head}
              <div class="segmented" style="grid-template-columns: repeat(${schema.enum.length}, minmax(0, 1fr)); width: fit-content">
                ${schema.enum.map((option) => `
                  <label>
                    <input data-plugin-detail-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" type="radio" name="plugin-detail-${escapeHtml(plugin.id)}-${escapeHtml(field.key)}" value="${escapeHtml(option)}" ${String(value) === String(option) ? "checked" : ""} ${disabled}>
                    ${escapeHtml(settingLabel(option))}
                  </label>
                `).join("")}
              </div>
            </div>
          `;
        }
        if (schema.type === "array" && Array.isArray(schema.items?.enum)) {
          const selected = Array.isArray(value) ? value.map(String) : [];
          return `
            <div class="pluginDetailSetting">
              ${head}
              <div class="choicePills">
                ${schema.items.enum.map((option) => `
                  <label class="choicePill">
                    <input data-plugin-detail-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" data-setting-kind="array" value="${escapeHtml(option)}" type="checkbox" ${selected.includes(String(option)) ? "checked" : ""} ${disabled}>
                    ${escapeHtml(settingLabel(option))}
                  </label>
                `).join("")}
              </div>
            </div>
          `;
        }
        if (plugin.id === "openleash.rules-enforcer" && field.key === "rules") {
          const rules = normalizeRuleEditorValues(value);
          return `
            <div class="pluginDetailSetting">
              ${head}
              <div class="ruleListEditor" data-plugin-detail-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" data-setting-kind="rule-list">
                <div class="ruleListRows" data-rule-list="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}">
                  ${rules.map((rule) => ruleEditorRow(plugin.id, field.key, rule, disabled)).join("")}
                </div>
                ${!disabled ? `
                  <div class="ruleListActions">
                    <button type="button" class="secondary" id="addPluginRule">Add rule</button>
                    <button type="button" class="secondary" id="scanPluginRules">Scan agent instruction files</button>
                    <button type="button" class="secondary" id="importPluginRules">Import JSON rules</button>
                  </div>
                ` : ""}
              </div>
            </div>
          `;
        }
        if ((schema.type === "array" && schema.items?.type === "string") || isStringArraySetting(value)) {
          return `
            <div class="pluginDetailSetting">
              ${head}
              <textarea class="detailSettingInput" data-plugin-detail-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" data-setting-kind="string-array" ${disabled}>${escapeHtml(Array.isArray(value) ? value.join("\n") : String(value ?? ""))}</textarea>
            </div>
          `;
        }
        if (schema.type === "boolean" || typeof value === "boolean") {
          return `
            <label class="pluginDetailSetting">
              ${head}
              <span class="switch"><input data-plugin-detail-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" type="checkbox" ${value ? "checked" : ""} ${disabled}><span></span></span>
            </label>
          `;
        }
        if (schema.type === "number" || schema.type === "integer" || typeof value === "number") {
          return `
            <div class="pluginDetailSetting">
              ${head}
              <input class="detailSettingInput" data-plugin-detail-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" type="number" value="${escapeHtml(value ?? 0)}" ${disabled}>
            </div>
          `;
        }
        return `
          <div class="pluginDetailSetting">
            ${head}
            <input class="detailSettingInput" data-plugin-detail-setting="${escapeHtml(plugin.id)}" data-setting-key="${escapeHtml(field.key)}" value="${escapeHtml(value ?? "")}" placeholder="Default" ${disabled}>
          </div>
        `;
      }

      function pluginSettingHint(key) {
        if (key === "action" || key.endsWith("Action")) return "Let it continue records what happened. Ask me first pauses AI for your choice. Stop it blocks the action.";
        if (key === "categories") return "Choose the information you never want AI to share by mistake.";
        if (key === "level") return "Higher savings remove more repeated text before it is sent to AI.";
        if (key === "conciseResponse") return "Shorter answers can also lower your AI bill.";
        if (key === "suspiciousRiskThreshold" || key === "notificationRiskThreshold") return "Balanced is recommended. Choose Warn me more if you prefer extra caution.";
        if (key === "minimumCodeCharacters") return "Most code changes is recommended. Tiny snippets are less useful to check.";
        if (key === "redactSecrets") return "Private values will not appear in the history you see in Leash.";
        if (key === "rules") return "Write each boundary in normal language, then choose whether Leash should ask you or stop AI.";
        return "";
      }

      function advancedSettingLabel(key) {
        const labels = {
          model: "Evaluation model override",
          minimumChars: "Minimum conversation characters",
          protectRecent: "Recent messages kept unchanged",
          ccrEnabled: "Repeated-context reuse",
          ccrTtlSeconds: "Repeated-context reuse time (seconds)",
          policySet: "Evaluation policy set",
          notificationRiskThreshold: "Exact warning score (0–100)",
          suspiciousRiskThreshold: "Exact hidden-instruction score (0–100)",
          minimumCodeCharacters: "Exact minimum code size (characters)"
        };
        return labels[key] || settingLabel(key);
      }

      function advancedSettingHint(key) {
        const hints = {
          model: "Leave blank to use the model selected by Leash.",
          minimumChars: "Shorter conversations are left unchanged.",
          protectRecent: "Number of recent messages Leash always keeps as written.",
          ccrEnabled: "Reuse previously checked repeated text when possible.",
          ccrTtlSeconds: "How long reused text remains valid.",
          policySet: "Optional named rule set used by the evaluator.",
          notificationRiskThreshold: "Lower scores create more warnings. Default: 70.",
          suspiciousRiskThreshold: "Lower scores flag more hidden instructions. Default: 50.",
          minimumCodeCharacters: "Code shorter than this is not checked. Default: 80."
        };
        return hints[key] || "";
      }

      function friendlyNumberOptions(key) {
        if (key === "notificationRiskThreshold") return [
          { value: 45, label: "Warn me more" },
          { value: 70, label: "Balanced" },
          { value: 85, label: "Only strong warnings" }
        ];
        if (key === "suspiciousRiskThreshold") return [
          { value: 35, label: "Warn me more" },
          { value: 50, label: "Balanced" },
          { value: 70, label: "Only strong warnings" }
        ];
        if (key === "minimumCodeCharacters") return [
          { value: 40, label: "Every code change" },
          { value: 80, label: "Most code changes" },
          { value: 250, label: "Only larger changes" }
        ];
        return [];
      }

      function normalizeProtectionAction(value) {
        if (value === "allow") return "allow";
        if (value === "block") return "block";
        return "ask";
      }

      function isProtectionActionSetting(key, values, value) {
        if (key === "action" || key.endsWith("Action")) return true;
        const options = Array.isArray(values) ? values.map(String) : [];
        return options.some((option) => ["allow", "ask", "block", "mask"].includes(option))
          && ["allow", "ask", "block", "mask"].includes(String(value));
      }

      function isStringArraySetting(value) {
        return Array.isArray(value) && value.every((item) => typeof item === "string");
      }

      function normalizeRuleEditorValues(value) {
        if (Array.isArray(value)) {
          return value
            .map((item) => normalizeRuleEditorValue(item))
            .filter((item) => item.text);
        }
        return String(value ?? "")
          .split(/\r?\n/g)
          .map((line) => line.trim())
          .filter(Boolean)
          .map((text) => ({ text, action: "ask" }));
      }

      function normalizeRuleEditorValue(value) {
        if (typeof value === "string") return { text: value.trim(), action: "ask" };
        if (value && typeof value === "object") {
          return {
            text: String(value.text || value.rule || value.description || "").trim(),
            action: normalizeProtectionAction(value.action),
            pending: Boolean(value.pending)
          };
        }
        return { text: "", action: "ask" };
      }

      function ruleEditorRow(pluginId, key, value = "", disabled = "") {
        const rule = normalizeRuleEditorValue(value);
        const responseName = `rule-action-${Math.random().toString(36).slice(2)}`;
        const pendingTexts = pluginPendingRuleTexts[pluginId] || new Set();
        const pending = rule.pending || pendingTexts.has(rule.text.toLowerCase());
        return `
          <div class="ruleListRow ${pending ? "pendingImport" : ""}">
            <textarea data-rule-item="${escapeHtml(pluginId)}" data-setting-key="${escapeHtml(key)}" placeholder="Ask before..." ${disabled}>${escapeHtml(rule.text)}</textarea>
            <div class="protectionResponseSlider ruleResponseSlider" data-level="${rule.action}">
              ${["allow", "ask", "block"].map((option) => `
                <label>
                  <input type="radio" data-rule-action="${escapeHtml(pluginId)}" data-setting-key="${escapeHtml(key)}" name="${responseName}" value="${option}" ${rule.action === option ? "checked" : ""} ${disabled}>
                  <span>${escapeHtml(settingLabel(option))}</span>
                </label>
              `).join("")}
            </div>
            ${disabled ? "" : `<button type="button" class="ruleListRemove" data-rule-remove="${escapeHtml(pluginId)}" title="Remove rule">-</button>`}
          </div>
        `;
      }

      function autosizeRuleTextareas(scope = root) {
        scope.querySelectorAll("[data-rule-item]").forEach((textarea) => {
          textarea.style.height = "auto";
          textarea.style.height = `${textarea.scrollHeight}px`;
          textarea.oninput = () => {
            textarea.style.height = "auto";
            textarea.style.height = `${textarea.scrollHeight}px`;
          };
        });
      }

      function effectivePluginConfig(plugin) {
        if (pluginDetailDraftConfigs[plugin.id]) return {
          ...(pluginDetailDraftConfigs[plugin.id] || {})
        };
        return baseEffectivePluginConfig(plugin);
      }

      function baseEffectivePluginConfig(plugin) {
        return {
          ...(plugin.defaultConfig || {}),
          ...(plugin.settings?.config || {})
        };
      }

      function addRulesToPluginDraft(plugin, rules) {
        const base = pluginDetailDraftConfigs[plugin.id]
          ? { ...(pluginDetailDraftConfigs[plugin.id] || {}) }
          : baseEffectivePluginConfig(plugin);
        const existingRules = normalizeRuleEditorValues(base.rules);
        const seen = new Set(existingRules.map((rule) => rule.text.toLowerCase()));
        const pendingTexts = pluginPendingRuleTexts[plugin.id] || new Set();
        const nextRules = [...existingRules];
        for (const rule of rules || []) {
          const normalized = normalizeRuleEditorValue(rule);
          if (!normalized.text || seen.has(normalized.text.toLowerCase())) continue;
          seen.add(normalized.text.toLowerCase());
          pendingTexts.add(normalized.text.toLowerCase());
          nextRules.push({ ...normalized, pending: true });
        }
        pluginPendingRuleTexts[plugin.id] = pendingTexts;
        pluginDetailDraftConfigs[plugin.id] = {
          ...base,
          rules: nextRules
        };
      }

      function collectPluginDetailConfig(plugin) {
        const config = effectivePluginConfig(plugin);
        root.querySelectorAll(`[data-plugin-detail-setting="${cssEscape(plugin.id)}"]`).forEach((input) => {
          const key = input.dataset.settingKey;
          if (!key) return;
          if (input.dataset.settingKind === "array") {
            config[key] = [...root.querySelectorAll(`[data-plugin-detail-setting="${cssEscape(plugin.id)}"][data-setting-key="${cssEscape(key)}"]:checked`)].map((item) => item.value);
            return;
          }
          if (input.dataset.settingKind === "string-array") {
            config[key] = String(input.value || "")
              .split(/\r?\n/g)
              .map((line) => line.replace(/^[-*]\s+/, "").trim())
              .filter(Boolean);
            return;
          }
          if (input.dataset.settingKind === "rule-list") {
            config[key] = [...root.querySelectorAll(`[data-rule-item="${cssEscape(plugin.id)}"][data-setting-key="${cssEscape(key)}"]`)]
              .map((item) => {
                const row = item.closest(".ruleListRow");
                return {
                  text: String(item.value || "").replace(/^[-*]\s+/, "").trim(),
                  action: normalizeProtectionAction(row?.querySelector("[data-rule-action]:checked")?.value)
                };
              })
              .filter((item) => item.text);
            return;
          }
          if (input.dataset.settingKind === "number-choice") {
            if (input.type !== "radio" || input.checked) config[key] = Number(input.value || 0);
            return;
          }
          if (input.type === "radio") {
            if (input.checked) config[key] = input.value;
            return;
          }
          if (input.type === "checkbox") {
            config[key] = Boolean(input.checked);
            return;
          }
          if (input.type === "number") {
            config[key] = Number(input.value || 0);
            return;
          }
          config[key] = input.value;
        });
        return config;
      }

      function bindPluginDetailSettings(plugin) {
        const button = document.getElementById("savePluginDetailSettings");
        const status = document.getElementById("pluginDetailSaveStatus");
        if (!button || plugin.organizationPolicy?.configLocked) return;
        const importRules = document.getElementById("importPluginRules");
        const addRule = document.getElementById("addPluginRule");
        const scanRules = document.getElementById("scanPluginRules");
        const addProfile = document.getElementById("addPluginProfile");
        const addProjectProfile = document.getElementById("addProjectPluginProfile");
        const addAgentProfile = document.getElementById("addAgentPluginProfile");
        if (addProfile) addProfile.onclick = () => {
          const profiles = plugin.settings?.profiles || (plugin.settings.profiles = []);
          profiles.push({ id: `profile-${Date.now()}`, name: "Agent override", agentKinds: [], config: {} });
          renderPluginDetail();
        };
        if (addProjectProfile) addProjectProfile.onclick = () => {
          const profiles = plugin.settings?.profiles || (plugin.settings.profiles = []);
          profiles.push({ id: `project-${Date.now()}`, name: "Project rules", agentKinds: [], projectPaths: [""], config: { rules: [] } });
          renderPluginDetail();
        };
        if (addAgentProfile) addAgentProfile.onclick = () => {
          const profiles = plugin.settings?.profiles || (plugin.settings.profiles = []);
          profiles.push({ id: `agent-${Date.now()}`, name: "Agent rules", agentKinds: [], config: { rules: [] } });
          renderPluginDetail();
        };
        root.querySelectorAll("[data-remove-plugin-profile]").forEach((removeButton) => {
          removeButton.onclick = () => {
            plugin.settings.profiles = (plugin.settings?.profiles || []).filter((profile) => profile.id !== removeButton.dataset.removePluginProfile);
            renderPluginDetail();
          };
        });
        root.querySelectorAll(`[data-rule-remove="${cssEscape(plugin.id)}"]`).forEach((removeButton) => {
          removeButton.onclick = () => {
            removeButton.closest(".ruleListRow")?.remove();
            pluginDetailDraftConfigs[plugin.id] = collectPluginDetailConfig(plugin);
          };
        });
        autosizeRuleTextareas();
        const detailSettings = root.querySelector(".pluginDetailSettings");
        const persistDraft = () => {
          pluginDetailDraftConfigs[plugin.id] = collectPluginDetailConfig(plugin);
        };
        detailSettings?.addEventListener("input", persistDraft);
        detailSettings?.addEventListener("change", persistDraft);
        if (addRule) {
          addRule.onclick = () => {
            const list = root.querySelector(`[data-rule-list="${cssEscape(plugin.id)}"][data-setting-key="rules"]`);
            if (list) {
              list.insertAdjacentHTML("beforeend", ruleEditorRow(plugin.id, "rules", ""));
              const row = list.lastElementChild;
              const removeButton = row?.querySelector("[data-rule-remove]");
              if (removeButton) {
                removeButton.onclick = () => {
                  removeButton.closest(".ruleListRow")?.remove();
                  persistDraft();
                };
              }
              autosizeRuleTextareas(row || root);
              row?.querySelector("textarea")?.focus();
            }
          };
        }
        if (scanRules) {
          scanRules.onclick = async () => {
            status.textContent = "Scanning agent instruction files...";
            const result = await window.openleash.discoverInstructionRules({ chooseProject: true });
            if (!result?.ok) {
              status.textContent = result?.canceled ? "" : result?.error || "Could not scan agent instruction files.";
              return;
            }
            const rawCandidates = Array.isArray(result.candidates) && result.candidates.length ? result.candidates : (result.policies || []);
            const candidates = rawCandidates
              .map((rule, index) => {
                const text = rule.text || rule.description || rule.natural_language_rule || rule.name;
                const agent = rule.agent || String(rule.category || "Agent instructions").replace(/\s+instructions$/i, "");
                return text ? {
                  id: `candidate-${index}-${String(text).slice(0, 24).replace(/\W+/g, "-")}`,
                  text,
                  action: "ask",
                  agent,
                  label: rule.label || rule.sourceLabel || "Instruction file",
                  path: rule.path || rule.source || "",
                  scope: rule.scope || "project"
                } : undefined;
              })
              .filter(Boolean);
            if (candidates.length === 0) {
              status.textContent = "No agent instruction rules found.";
              return;
            }
            pendingRuleImport = {
              pluginId: plugin.id,
              candidates,
              selected: new Set(candidates.map((candidate) => candidate.id)),
              sourceCount: Array.isArray(result.sources) ? result.sources.length : 0
            };
            view = "plugin-rule-import";
            renderView();
          };
        }
        if (importRules) {
          importRules.onclick = async () => {
            const result = await window.openleash.importRuleListJson();
            if (!result?.ok) {
              status.textContent = result?.canceled ? "" : result?.error || "Could not import JSON rules.";
              return;
            }
            addRulesToPluginDraft(plugin, result.rules || []);
            renderPluginDetail();
            const nextStatus = document.getElementById("pluginDetailSaveStatus");
            if (nextStatus) nextStatus.textContent = `Imported ${(result.rules || []).length} rule${(result.rules || []).length === 1 ? "" : "s"} from JSON. Unsaved rows are highlighted.`;
          };
        }
        button.onclick = async () => {
          button.disabled = true;
          status.textContent = "Saving...";
          const config = collectPluginDetailConfig(plugin);
          let profiles;
          try { profiles = collectPluginProfiles(plugin); }
          catch (error) {
            status.textContent = error?.message || "Invalid agent-specific settings.";
            button.disabled = false;
            return;
          }
          const result = await window.openleash.savePluginSettings({
            pluginId: plugin.id,
            enabled: pluginInstalled(plugin),
            config,
            profiles,
            orderingPriority: plugin.settings?.orderingPriority ?? plugin.ordering?.priority ?? null,
            marketplace: plugin.marketplace || null
          }).catch((error) => ({ ok: false, error: error?.message || "Could not save Feature settings." }));
          if (!result?.ok) {
            status.textContent = result?.error || "Could not save settings.";
            button.disabled = false;
            return;
          }
          state.plugins = (state.plugins || []).map((item) => item.id === plugin.id
            ? { ...item, settings: result.settings || { ...(item.settings || {}), config } }
            : item
          );
          delete pluginDetailDraftConfigs[plugin.id];
          delete pluginPendingRuleTexts[plugin.id];
          status.textContent = "Settings saved.";
          button.disabled = false;
        };
      }

      function bindModelSelection() {
        root.querySelectorAll("[name=provider]").forEach((input) => {

      function setupRuleGroups(rules) {
        const list = rules || [];
        const defs = [
          {
            title: "Security rules",
            description: "Secrets, credentials, personal data, and sensitive staged content.",
            ids: ["credentials", "committing-secrets", "personal-data"]
          },
          {
            title: "Git rules",
            description: "Publishing, protected branches, force pushes, and history rewrites.",
            ids: ["git-publish", "protected-branch-push", "git-history-rewrite"]
          },
          {
            title: "Package rules",
            description: "Dependency changes, lockfiles, and global package installs.",
            ids: ["supply-chain-change", "global-package-install"]
          },
          {
            title: "Infrastructure rules",
            description: "Cloud resources, Kubernetes, Terraform, and local destruction.",
            ids: ["cloud-resource-deletion", "infra-destruction", "filesystem-destruction"]
          },
          {
            title: "Data rules",
            description: "Databases, broad mutations, and external data sharing.",
            ids: ["database-destruction", "database-mass-update", "exfiltration"]
          }
        ];
        const used = new Set();
        const groups = defs.map((def, index) => {
          const groupRules = def.ids.map((id) => list.find((rule) => rule.id === id)).filter(Boolean);
          groupRules.forEach((rule) => used.add(rule.id));
          return { ...def, first: index === 0, rules: groupRules };
        }).filter((group) => group.rules.length > 0);
        const other = list.filter((rule) => !used.has(rule.id));
        if (other.length > 0) {
          groups.push({
            title: "Custom rules",
            description: "Rules imported locally or added by your Leash administrator.",
            ids: other.map((rule) => rule.id),
            first: groups.length === 0,
            rules: other
          });
        }
        return groups;
      }

      function ruleCards(rules, options = {}) {
        const managed = Boolean(options.managed);
        const grouped = Boolean(options.grouped);
        const groups = {};
        for (const rule of rules || []) (groups[grouped ? rule.category : ""] ||= []).push(rule);
        return Object.entries(groups).map(([category, items]) => `
          <div>
            ${category ? `<div class="category">${escapeHtml(category)}</div>` : ""}
            <div class="ruleGroup">
              ${items.map((rule) => `
                <label class="card row ruleLine ${rule.locked ? "lockedRule" : ""}">
                  <span>
                    <strong>${escapeHtml(rule.name)}${ruleBadge(rule, managed)}</strong>
                    <small>${escapeHtml(rule.description)}</small>
                  </span>
                  <span class="switch"><input data-rule="${rule.id}" type="checkbox" ${ruleEnabled(rule) ? "checked" : ""} ${rule.locked ? "disabled" : ""}><span></span></span>
                </label>
              `).join("")}
            </div>
          </div>
        `).join("");
      }

      function ruleBadge(rule, managedContext) {
        if (rule.locked) return `<span class="managedBadge">Mandatory</span>`;
        if (managedContext && (rule.managedByOrganization || rule.managed_by_organization || rule.managed)) {
          return `<span class="managedBadge soft">Managed</span>`;
        }
        return "";
      }

      function ruleEnabled(rule) {
        if (rule.locked) return true;
        if (isSetupLocked() && selectedRules) return selectedRules.get(rule.id) ?? Boolean(rule.enabled);
        return Boolean(rule.enabled);
      }

      function projectTag(value) {
        return value ? String(value).replace(/\\/g, "/").replace(/\/+$/, "").split("/").filter(Boolean).pop() : "";
      }

      function normalizeProjectScopePath(value) {
        const normalized = String(value || "").trim().replace(/\\/g, "/").replace(/\/{2,}/g, "/");
        return normalized === "/" ? normalized : normalized.replace(/\/+$/, "");
      }

      function detectedProjectPaths() {
        const paths = new Set();
        const add = (value) => {
          const projectPath = normalizeProjectScopePath(value);
          if (projectPath) paths.add(projectPath);
        };
        (state.agents || []).forEach((agent) => {
          add(agent.project_path || agent.projectPath);
          (agent.sessions || []).forEach((session) => add(session.project_path || session.projectPath));
        });
        (state.history || []).forEach((item) => add(item.project_path || item.projectPath));
        (state.pending || state.pendingApprovals || []).forEach((item) => add(item.project_path || item.projectPath));
        (state.outcomes || []).forEach((outcome) => add(outcome.context?.projectPath || outcome.project_path));
        (state.skills || []).forEach((skill) => add(skill.project_path || skill.projectPath));
        return [...paths].sort((left, right) => projectTag(left).localeCompare(projectTag(right)) || left.localeCompare(right)).map((path) => ({ path, name: projectTag(path) || path }));
      }

      function formatTime(value) {
        return value ? new Date(value).toLocaleString() : "";
      }

      function formatDuration(seconds) {
        const total = Math.max(0, Number(seconds || 0));
        if (total < 60) return total ? `${total}s` : "0s";
        const minutes = Math.floor(total / 60);
        if (minutes < 60) return `${minutes}m`;
        const hours = Math.floor(minutes / 60);
        const rest = minutes % 60;
        return rest ? `${hours}h ${rest}m` : `${hours}h`;
      }

      function sessionStat(label, metric) {
        const count = Number(metric?.session_count || 0);
        return `<div class="sessionStat"><strong>${escapeHtml(formatDuration(metric?.duration_seconds || 0))}</strong><small>${escapeHtml(label)} · ${count} session${count === 1 ? "" : "s"}</small></div>`;
      }

      function allAgentSessions() {
        return (state.agents || [])
          .flatMap((agent) => (agent.sessions || []).map((session) => ({ ...session, agent_name: agent.display_name, agent_kind: agent.kind, user_name: agent.user_name, hostname: agent.hostname })))
          .sort((a, b) => new Date(b.last_activity_at || 0).getTime() - new Date(a.last_activity_at || 0).getTime());
      }

      function usageByPerson(sessions) {
        const grouped = new Map();
        for (const session of sessions) {
          const key = session.user_name || session.hostname || "This Mac";
          const item = grouped.get(key) || { name: key, sessions: 0, duration_seconds: 0, subagent_seconds: 0, last_activity_at: "" };
          item.sessions += 1;
          item.duration_seconds += Number(session.duration_seconds || 0);
          item.subagent_seconds += Number(session.subagent_seconds || 0);
          if (!item.last_activity_at || new Date(session.last_activity_at || 0) > new Date(item.last_activity_at || 0)) item.last_activity_at = session.last_activity_at;
          grouped.set(key, item);
        }
        return [...grouped.values()].sort((a, b) => b.duration_seconds - a.duration_seconds);
      }

      function resolutionTime(item) {
        return item.resolved_at || (item.resolution === "allow" && item.decision === "allow" ? item.created_at : "");
      }

      function resolutionLabel(item) {
        const value = item.resolution || item.decision;
        if (value === "allow") return "Allowed at";
        if (value === "deny") return "Denied at";
        return "Resolved at";
      }

      function agentIcon(agent) {
        if (agent.icon) return `<img src="agents/${escapeHtml(agentIconFile(agent.icon))}" alt="">`;
        return escapeHtml(String(agent.displayName || "AI").split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase());
      }

      function agentIconFile(icon) {
        const value = String(icon || "");
        if (value.includes(".")) return value;
        if (value === "claude") return "claude.png";
        if (value === "copilot") return "githubcopilot.svg";
        if (value === "gemini") return "googlegemini.svg";
        if (value === "opencode") return "opencode.png";
        if (value === "openai" || value === "codex") return "codex.png";
        if (value === "cline") return "cline.png";
        if (value === "cursor") return "cursor.png";
        if (value === "windsurf") return "windsurf.svg";
        return value;
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
      }

      function truncate(value, max) {
        return value.length <= max ? value : `${value.slice(0, max - 1)}…`;
      }

      function cssEscape(value) {
        if (window.CSS?.escape) return window.CSS.escape(String(value));
        return String(value).replace(/["\\]/g, "\\$&");
      }

      function isPersonalEmail(email) {
        const domain = String(email || "").split("@")[1]?.toLowerCase() || "";
        return new Set([
          "gmail.com",
          "googlemail.com",
          "outlook.com",
          "hotmail.com",
          "live.com",
          "msn.com",
          "icloud.com",
          "me.com",
          "mac.com",
          "yahoo.com",
          "proton.me",
          "protonmail.com",
          "aol.com"
        ]).has(domain);
      }

      window.openleash.onSetupProgress?.((payload) => {
        if (!setupFinishing || !payload || typeof payload !== "object") return;
        setupInstallProgress = {
          percent: Math.max(0, Math.min(100, Number(payload.percent || 0))),
          stage: String(payload.stage || "prepare"),
          title: String(payload.title || "Installing Leash"),
          detail: String(payload.detail || "Applying protection to this Mac...")
        };
        renderSetup();
      });
      window.openleash.onUpdate(render);
      window.openleash.onAuth((payload) => {
        if (payload?.ok) {
          if (setupClientMode === "cloud" && setupAudience === "organization" && isPersonalEmail(payload.userEmail)) {
            setupRemoteAuth = undefined;
            setupRemoteError = "Use your company Google Workspace or Microsoft 365 account, not a personal email address.";
            setupRemoteNotice = "";
            setupRemoteBusy = false;
            renderSetup();
            return;
          }
          setupRemoteAuth = payload;
          setupRemoteError = "";
          setupRemoteNotice = "";
          setupRemoteBusy = false;
          setupRemotePackage = setupAudience === "organization" ? "work-managed" : "personal-managed";
          state.billing = payload.billing || state.billing;
          setupRemoteKeySaved = Boolean(payload.evaluationProvider?.connected);
          const signedInStep = setupClientMode === "custom" ? 6 : setupAudience === "organization" ? 3 : 4;
          setupStep = Math.max(setupStep, signedInStep);
          void loadManagedRules().then(() => {
            if (shouldAutoFinishAfterRemoteAuth()) {
              setupSkipDashboardOpenAfterInstall = true;
              setupRemoteNotice = "Installing Leash on this Mac...";
              renderSetup();
              void finishSetup();
              return;
            }
            renderSetup();
          });
        } else {
          setupRemoteBusy = false;
          setupRemoteNotice = "";
          setupRemoteError = payload?.error || "Sign-in did not complete.";
          renderSetup();
        }
      });
      root.innerHTML = `<div class="loadingOverview" role="status" aria-live="polite"><span></span><strong>Loading your overview</strong><small>Leash is checking this computer for protected agents and recent history.</small></div>`;
      window.openleash.list().then(render).catch(() => {
        root.innerHTML = `<div class="loadingOverview"><strong>Leash could not load your overview.</strong><small>Close and reopen the app to try again.</small></div>`;
      });
    </script>
  </body>
</html>
