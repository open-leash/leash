<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #22201a;
        --ink-2: #3a3730;
        --muted: #5c584a;
        --line: #ece7d6;
        --line-2: #c4bfa8;
        --soft: #faf8ef;
        --panel: #ffffff;
        --accent: #5b4df0;
        --accent-2: #b44df0;
        --accent-soft: #f6f5ff;
        --yellow-soft: #fff4d6;
        --green: #18a558;
        --green-soft: #e6f5ed;
        --red: #e94e3a;
        --shadow-sm: 0 1px 2px rgba(12, 12, 10, .04), 0 1px 1px rgba(12, 12, 10, .03);
        --shadow-md: 0 2px 4px rgba(12, 12, 10, .04), 0 8px 24px -8px rgba(12, 12, 10, .08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #fffdf7;
        color: var(--ink);
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
        user-select: none;
        overflow: hidden;
      }
      .drag-strip {
        position: fixed;
        z-index: 20;
        top: 0;
        left: 0;
        right: 0;
        height: 58px;
        -webkit-app-region: drag;
        pointer-events: none;
      }
      .brand, .head {
        -webkit-app-region: drag;
      }
      button, input, label, nav, main, aside, .card, .switch, .actions {
        -webkit-app-region: no-drag;
      }
      .app {
        --sidebar-width: clamp(280px, 25vw, 340px);
        height: 100vh;
        min-height: 0;
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        gap: 14px;
        padding: 14px;
        overflow: hidden;
      }
      .app.sidebar-expanded {
        --sidebar-width: min(410px, 42vw);
      }
      aside, main {
        background: var(--panel);
        border-radius: 18px;
        border: 1px solid rgba(16, 19, 24, .06);
      }
      aside {
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-height: 0;
        overflow: hidden;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        font-size: 21px;
        font-weight: 900;
      }
      .brand img { width: 28px; height: 28px; border-radius: 7px; object-fit: contain; }
      .brandName { flex: 1 1 auto; }
      .sidebarExpand {
        position: relative;
        z-index: 1;
        width: 36px;
        height: 36px;
        display: grid;
        flex: 0 0 36px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--soft);
        color: var(--muted);
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      .sidebarExpand:hover { border-color: var(--line-2); color: var(--ink); }
      .sidebarExpand svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform .18s ease;
      }
      .app.sidebar-expanded .sidebarExpand svg { transform: rotate(180deg); }
      nav {
        display: grid;
        flex: 1 1 auto;
        min-height: 0;
        gap: 12px;
        overflow-x: hidden;
        overflow-y: auto;
        touch-action: pan-y;
        pointer-events: auto;
        overscroll-behavior: contain;
        padding-right: 4px;
        scrollbar-gutter: stable;
      }
      nav::-webkit-scrollbar { width: 6px; }
      nav::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(58, 55, 48, .18);
      }
      .navSection {
        display: grid;
        gap: 6px;
      }
      nav button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        background: transparent;
        color: var(--ink-2);
        text-align: left;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      nav button {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      nav button span {
        min-width: 0;
      }
      nav button .navLabel {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .app.sidebar-expanded nav button .navLabel {
        overflow: visible;
        text-overflow: clip;
        white-space: normal;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      nav button.active { background: var(--soft); color: var(--ink); }
      nav button svg {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .navCategory {
        border: 1px solid transparent;
      }
      .navCategory.cost {
        background: #e9e4fa;
        color: #5b47e0;
      }
      .navCategory.security {
        background: #ddefe8;
        color: #0b7968;
      }
      .navCategory.observability {
        background: #dfeaf8;
        color: #2a63d8;
      }
      .navCategory.utility {
        background: #f4e9d5;
        color: #a15b12;
      }
      .navCategory.active {
        box-shadow: inset 0 0 0 1px currentColor;
      }
      .navCount {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 22px;
        border-radius: 999px;
        padding: 0 7px;
        background: rgba(255, 255, 255, .62);
        font-size: 12px;
        font-weight: 900;
      }
      .navSubmenu {
        display: grid;
        gap: 4px;
        margin: 0 0 4px 16px;
        padding-left: 10px;
        border-left: 1px solid var(--line);
      }
      nav button.navPlugin {
        min-height: 34px;
        border-radius: 10px;
        padding: 8px 10px;
        align-items: flex-start;
        color: var(--ink-2);
        font-size: 13px;
      }
      nav button.navPlugin .navLabel {
        overflow: visible;
        text-overflow: clip;
        white-space: normal;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      .navPluginIcon {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        overflow: hidden;
        border-radius: 7px;
        background: rgba(255, 255, 255, .72);
        font-size: 15px;
      }
      .navPluginIcon img {
        width: 18px;
        height: 18px;
        object-fit: contain;
      }
      nav button.navPlugin.active {
        background: rgba(91, 79, 229, .1);
        color: var(--accent);
      }
      body.setup-locked nav {
        display: none;
      }
      body.setup-locked .foot {
        display: none;
      }
      body.setup-locked .app {
        grid-template-columns: minmax(0, 1fr);
        padding: 14px;
      }
      body.setup-locked aside {
        display: none;
      }
      body.setup-locked main {
        width: min(1120px, calc(100vw - 28px));
        margin: 0 auto;
        box-shadow: var(--shadow-md);
      }
      body.intro-active main {
        height: calc(100vh - 28px);
        padding: 0;
        overflow: hidden;
      }
      .foot {
        flex: 0 0 auto;
        margin-top: auto;
        padding: 14px;
        border-radius: 14px;
        background: var(--soft);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      main { min-width: 0; min-height: 0; padding: 48px 38px 38px; overflow: auto; }
      h1 { margin: 0; font-size: 38px; line-height: 1.05; letter-spacing: 0; font-weight: 700; }
      h2 { margin: 0; font-size: 20px; line-height: 1.14; letter-spacing: 0; font-weight: 700; }
      p { margin: 0; color: var(--muted); line-height: 1.5; }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--line);
      }
      .grid { display: grid; gap: 14px; margin-top: 24px; }
      .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .setupStack {
        display: grid;
        gap: 24px;
        margin-top: 28px;
      }
      .setupStepper {
        display: grid;
        gap: 10px;
        margin-top: 24px;
      }
      .setupProgress {
        display: grid;
        gap: 10px;
        margin-top: 24px;
      }
      .setupProgressMeta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
      }
      .setupProgressBar {
        height: 8px;
        border-radius: 999px;
        background: rgba(216, 211, 199, .42);
        overflow: hidden;
      }
      .setupProgressFill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }
      .setupInstallScreen {
        min-height: calc(100vh - 120px);
        display: grid;
        place-items: center;
        padding: 36px 0;
      }
      .setupInstallCard {
        width: min(820px, 100%);
        display: grid;
        justify-items: center;
        gap: 24px;
        padding: 54px 58px 48px;
        border: 1.5px solid var(--line);
        border-radius: 34px;
        background:
          radial-gradient(circle at 50% 0%, rgba(107, 86, 255, .16), transparent 42%),
          linear-gradient(145deg, #fff 0%, #fbf9f2 100%);
        box-shadow: 0 30px 80px rgba(39, 34, 66, .12);
        text-align: center;
        overflow: hidden;
      }
      .setupInstallMark {
        width: 66px;
        height: 66px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: linear-gradient(145deg, var(--accent), var(--accent-2));
        color: #fff;
        box-shadow: 0 14px 28px rgba(102, 76, 255, .24);
      }
      .setupInstallMark.complete {
        background: linear-gradient(145deg, #16a36a, #55dca0);
      }
      .setupInstallMark.error {
        background: linear-gradient(145deg, #d6465d, #ff7a86);
      }
      .setupInstallMark svg { width: 34px; height: 34px; }
      .setupInstallCopy { display: grid; gap: 10px; max-width: 620px; }
      .setupInstallCopy h1 { font-size: clamp(34px, 5vw, 52px); }
      .setupInstallCopy p { font-size: 17px; }
      .setupInstallAgents {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 20px;
        padding: 12px 0 4px;
        flex-wrap: wrap;
      }
      .setupInstallAgent {
        width: 76px;
        display: grid;
        justify-items: center;
        gap: 9px;
      }
      .setupInstallAgentIcon {
        position: relative;
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(216, 211, 199, .9);
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 10px 26px rgba(39, 34, 66, .08);
        overflow: hidden;
      }
      .setupInstallAgentIcon img {
        position: absolute;
        width: 36px;
        height: 36px;
        object-fit: contain;
      }
      .setupInstallAgentIcon .gray {
        filter: grayscale(1);
        opacity: .32;
      }
      .setupInstallAgentIcon .color {
        clip-path: inset(0 var(--unfilled, 100%) 0 0);
        transition: clip-path .5s cubic-bezier(.22, .8, .3, 1);
      }
      .setupInstallAgent small {
        width: 100%;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        line-height: 1.2;
      }
      .setupInstallMeter { width: min(650px, 100%); display: grid; gap: 12px; }
      .setupInstallMeterTrack {
        height: 14px;
        padding: 3px;
        border-radius: 999px;
        background: rgba(216, 211, 199, .52);
        overflow: hidden;
      }
      .setupInstallMeterFill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #5d4cff, #b34fff, #51dca0);
        box-shadow: 0 0 18px rgba(107, 86, 255, .35);
        transition: width .5s cubic-bezier(.22, .8, .3, 1);
      }
      .setupInstallMeterMeta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--ink-2);
        font-size: 13px;
        font-weight: 850;
      }
      .setupInstallStages {
        width: min(650px, 100%);
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .setupInstallStage {
        padding: 8px 6px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-size: 11px;
        font-weight: 850;
      }
      .setupInstallStage.done { background: var(--green-soft); color: #08774d; }
      .setupInstallStage.active { background: #eeeaff; color: var(--accent); }
      .setupInstallError {
        width: min(650px, 100%);
        padding: 14px 16px;
        border-radius: 16px;
        background: #fff0f2;
        color: #a82139;
        font-weight: 750;
        line-height: 1.45;
      }
      @media (max-width: 760px) {
        .setupInstallCard { padding: 38px 22px 34px; border-radius: 26px; }
        .setupInstallAgents { gap: 12px; }
        .setupInstallStages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      .localBackendProgress {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }
      .localBackendProgressBar {
        height: 8px;
        border-radius: 999px;
        background: rgba(216, 211, 199, .5);
        overflow: hidden;
      }
      .localBackendProgressFill {
        width: 48%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width .25s ease;
      }
      .localBackendProgressFill.ready {
        width: 100%;
        background: linear-gradient(90deg, #18a558, #6ed59a);
      }
      .localBackendProgressFill.busy {
        width: 68%;
        animation: localBackendPulse 1.2s ease-in-out infinite;
      }
      .localBackendStatus {
        color: var(--muted);
        font-size: 14px;
        font-weight: 800;
      }
      @keyframes localBackendPulse {
        0%, 100% { opacity: .62; }
        50% { opacity: 1; }
      }
      .setupGreeting {
        margin-top: 10px;
        color: var(--ink-2);
        font-size: 16px;
        font-weight: 800;
      }
      .welcomeHero {
        position: relative;
        min-height: calc(100vh - 128px);
        display: grid;
        align-content: center;
        gap: 28px;
        max-width: 1080px;
        margin: 0 auto;
        isolation: isolate;
      }
      .welcomeAgents {
        position: absolute;
        z-index: -1;
        top: 0;
        right: 0;
        width: min(360px, 38vw);
        height: 210px;
        overflow: hidden;
        pointer-events: none;
      }
      .welcomeAgentIcon {
        position: absolute;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: rgba(255, 255, 255, .72);
        border: 1px solid rgba(16, 19, 24, .08);
        box-shadow: 0 10px 24px rgba(16, 19, 24, .12);
        will-change: transform;
      }
      .welcomeAgentIcon img {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }
      .welcomeMark {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: var(--soft);
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .welcomeMark svg {
        width: 38px;
        height: 38px;
      }
      .welcomeCopy {
        display: grid;
        gap: 12px;
      }
      .welcomeKicker {
        color: var(--ink);
        font-size: 24px;
        font-weight: 950;
        letter-spacing: 0;
      }
      .welcomeHero h1 {
        font-size: 74px;
        line-height: .98;
        max-width: 920px;
      }
      .welcomeHero p {
        max-width: 900px;
        font-size: 20px;
        line-height: 1.45;
      }
      .welcomeTiles {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .welcomeTile {
        min-height: 188px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
      }
      .welcomeTile strong {
        display: block;
        margin-bottom: 12px;
        font-size: 18px;
      }
      .welcomeTile p {
        font-size: 17px;
        line-height: 1.45;
      }
      .welcomeActions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 18px;
      }
      .welcomeFootnote {
        color: var(--muted);
        font-size: 15px;
        font-weight: 800;
      }
      .introScreen {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 18px;
        background: #06080d;
      }
      .introScreen video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .introSkip {
        position: absolute;
        right: 22px;
        bottom: 22px;
        border-color: rgba(255,255,255,.32);
        background: rgba(255,255,255,.9);
        backdrop-filter: blur(12px);
      }
      .setupStepPill {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        min-height: 54px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 9px 14px 9px 10px;
        background: white;
        color: var(--muted);
        font-weight: 900;
      }
      .setupStepPill b {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--soft);
        color: var(--muted);
        font-size: 13px;
      }
      .setupStepPill.active {
        border-color: rgba(93, 119, 205, .22);
        background: #f1f5ff;
        color: var(--ink);
      }
      .setupStepPill.active b {
        background: var(--accent);
        color: var(--ink);
      }
      .setupStepPill.done {
        color: var(--ink-2);
      }
      .setupStepPill.done b {
        background: #e9f8f1;
        color: #11795f;
      }
      .setupSection {
        display: grid;
        gap: 16px;
      }
      .setupSection h2 {
        margin: 0;
      }
      .setupSectionHead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .setupProtectionPromise {
        position: relative;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        overflow: hidden;
        border: 1.5px solid rgba(91, 77, 240, .22);
        border-radius: 18px;
        background: linear-gradient(135deg, #f2efff 0%, #fffdf7 58%, #eef9f3 100%);
      }
      .setupProtectionPromise::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        right: -70px;
        top: -110px;
        border-radius: 50%;
        background: rgba(91, 77, 240, .08);
      }
      .setupProtectionMark {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--ink);
        color: #fff;
      }
      .setupProtectionMark svg {
        width: 30px;
        height: 30px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }
      .setupProtectionPromise strong {
        display: block;
        margin-bottom: 3px;
        font-size: 17px;
      }
      .setupProtectionPromise p {
        margin: 0;
        max-width: 720px;
        line-height: 1.45;
      }
      .setupProtectionCount {
        position: relative;
        z-index: 1;
        padding: 8px 12px;
        border-radius: 999px;
        background: #fff;
        color: #12734e;
        font-size: 12px;
        font-weight: 850;
        white-space: nowrap;
        box-shadow: inset 0 0 0 1px rgba(18, 115, 78, .14);
      }
      .setupFeatureGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .setupFeatureCard {
        position: relative;
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        grid-template-rows: auto 1fr;
        gap: 11px 14px;
        min-height: 142px;
        padding: 18px;
        overflow: hidden;
        border: 1.5px solid var(--line);
        border-radius: 16px;
        background: #fff;
      }
      .setupFeatureCard::after {
        content: "";
        position: absolute;
        width: 110px;
        height: 110px;
        right: -54px;
        bottom: -66px;
        border-radius: 50%;
        background: rgba(91, 77, 240, .055);
      }
      .setupFeatureCard.cost::after {
        background: rgba(241, 180, 41, .12);
      }
      .setupFeatureIcon {
        grid-row: 1 / span 2;
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 13px;
        background: var(--accent-soft);
        font-size: 21px;
      }
      .setupFeatureCard.cost .setupFeatureIcon {
        background: var(--yellow-soft);
      }
      .setupFeatureHeading {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }
      .setupFeatureHeading strong {
        font-size: 16px;
        line-height: 1.2;
      }
      .setupFeatureOn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #14744f;
        font-size: 10px;
        font-weight: 850;
        white-space: nowrap;
      }
      .setupFeatureOn::before {
        content: "";
        width: 7px;

        </div>
        <nav id="sideNav"></nav>
        <div class="foot" id="modeFoot">Personal mode runs fully on this Mac. Rules, history, approvals, and Leash data stay local.</div>
      </aside>
      <main id="root"></main>
    </div>
    <script>
      let state = { rules: [], history: [], localProtections: [], excludedProjectPaths: [], setupComplete: false, introSeen: false };
      let selectedAgents;
      let selectedRules;
      let selectedPlugins;
      let pluginSelectionTouched = false;
      let pluginSetupConfigs = {};
      let setupPluginSearch = "";
      let setupPluginCategory = "all";
      let setupStep = 0;
      let setupAudience = "individual";
      let setupClientMode = "cloud";
      let setupConnectionTouched = false;
      let setupRemoteApiUrl = "https://api.openleash.com";
      let setupOrganizationSlug = "";
      let setupRemoteBootstrap;
      let setupRemoteAuth;
      let setupRemoteError = "";
      let setupFinishError = "";
      let setupRemoteNotice = "";
      let setupRemoteBusy = false;
      let setupRemoteProvider = "google";
      let setupRemoteKeySaved = false;
      let setupRemotePackage = "personal-managed";
      let setupFinishing = false;
      let setupInstallState = "idle";
      let setupInstallProgress = { percent: 0, stage: "prepare", title: "Preparing installation", detail: "Checking your selections..." };
      let setupSkipDashboardOpenAfterInstall = false;
      let setupDockerStatus;
      let setupDockerBusy = false;
      let setupDockerAutoStarted = false;
      let setupProvider = "openai";
      let setupApiKey = "";
      let setupIslandEnabled = true;
      let importedRules;
      let importRulesMessage = "";
      let desktopMessageTimer;
      let introPlaying = false;
      let welcomeAgentAnimation = 0;
      let view = "overview";
      let selectedEventId = "";
      let eventReturnView = "history";
      let selectedAgentHistoryKind = "";
      let historyVisibleCount = 12;
      let historyPage = 0;
      let historyHasMore = true;
      let historyLoading = false;
      let historyError = "";
      let notificationMenuOpen = false;
      let storedReadHistoryIds = [];
      try {
        const stored = JSON.parse(localStorage.getItem("leash-read-history") || "[]");
        storedReadHistoryIds = Array.isArray(stored) ? stored : [];
      } catch {
        localStorage.removeItem("leash-read-history");
      }
      const readHistoryIds = new Set(storedReadHistoryIds.map(String));
      const storedNotificationBaseline = Number(localStorage.getItem("leash-notification-baseline-at"));
      const notificationBaselineAt = Number.isFinite(storedNotificationBaseline) && storedNotificationBaseline > 0
        ? storedNotificationBaseline
        : Date.now();
      localStorage.setItem("leash-notification-baseline-at", String(notificationBaselineAt));
      let selectedMcpServerId = "";
      let selectedSkillPath = "";
      let pluginViewCategory = "all";
      let selectedPluginId = "";
      let pluginDetailTab = "insights";
      let pendingRuleImport = null;
      const pluginDetailDraftConfigs = {};
      const pluginPendingRuleTexts = {};
      const skillDocScrollTops = new Map();
      const openDebugRowIds = new Set();
      let debugSearch = "";
      let debugPluginFilter = "all";
      let debugEventFilter = "all";
      let debugLevelFilter = "all";
      let debugSort = "newest";
      let selectedAgentSessionId = "";
      let sidebarExpanded = localStorage.getItem("leash-sidebar-expanded") === "true";
      const root = document.getElementById("root");
      const sideNav = document.getElementById("sideNav");
      const modeFoot = document.getElementById("modeFoot");
      const appShell = document.querySelector(".app");
      const sidebarExpand = document.getElementById("sidebarExpand");

      function syncSidebarExpansion() {
        appShell.classList.toggle("sidebar-expanded", sidebarExpanded);
        sidebarExpand.setAttribute("aria-label", sidebarExpanded ? "Collapse navigation" : "Expand navigation");
        sidebarExpand.title = sidebarExpanded ? "Collapse navigation" : "Expand navigation";
      }
      sidebarExpand.onclick = () => {
        sidebarExpanded = !sidebarExpanded;
        localStorage.setItem("leash-sidebar-expanded", String(sidebarExpanded));
        syncSidebarExpansion();
      };
      syncSidebarExpansion();

      /* setup-connection-draft:start */
      function mergeSetupConnectionDraft(current, incoming, setupLocked, connectionTouched) {
        if (setupLocked && connectionTouched) return current;
        return {
          clientMode: incoming.clientMode || current.clientMode,
          remoteApiUrl: incoming.remoteApiUrl || incoming.cloudApiUrl || current.remoteApiUrl
        };
      }
      /* setup-connection-draft:end */

      function render(payload = {}) {
        const mainScroller = document.querySelector("main");
        const preservedLogScrollTop = view === "debug" ? (mainScroller?.scrollTop || 0) : 0;
        const incomingRules = payload.policies || payload.rules || state.rules;
        state = { ...state, ...payload, rules: importedRules || incomingRules };
        if (payload.desktopMessage) {
          if (desktopMessageTimer) clearTimeout(desktopMessageTimer);
          desktopMessageTimer = setTimeout(() => {
            state.desktopMessage = "";
            renderView();
          }, 5000);
        }
        const setupConnection = mergeSetupConnectionDraft(
          { clientMode: setupClientMode, remoteApiUrl: setupRemoteApiUrl },
          state,
          isSetupSurfaceActive(),
          setupConnectionTouched
        );
        setupClientMode = setupConnection.clientMode;
        setupRemoteApiUrl = setupConnection.remoteApiUrl;
        if (!selectedAgents && (state.localProtections || []).length > 0) {
          selectedAgents = new Set((state.localProtections || []).filter((agent) => agent.installed && agent.supportsInstall).map((agent) => agent.kind));
        }
        if (!selectedRules && (state.rules || []).length > 0) {
          selectedRules = new Map((state.rules || []).map((rule) => [rule.id, rule.locked ? true : Boolean(rule.enabled)]));
        }
        initializePluginSetupState();
        updateModeFoot();
        document.body.classList.toggle("setup-locked", isSetupSurfaceActive());
        document.body.classList.toggle("intro-active", isIntroLocked());
        if (isIntroLocked()) {
          if (!introPlaying) renderIntro();
          return;
        }
        introPlaying = false;
        if (isSetupSurfaceActive()) return renderSetup();
        importedRules = undefined;
        renderView();
        renderAvailabilityBanner();
        autosizeRuleTextareas();
        if (view === "debug" && mainScroller) {
          mainScroller.scrollTop = preservedLogScrollTop;
          requestAnimationFrame(() => { mainScroller.scrollTop = preservedLogScrollTop; });
        }
      }

      /* plugin-detail-edit-refresh:start */
      function shouldPreservePluginDetailEditor(currentView, currentTab, editorHasFocus) {
        return currentView === "plugin-detail" && currentTab === "settings" && editorHasFocus;
      }
      /* plugin-detail-edit-refresh:end */

      function modeLabel() {
        if (state.clientMode === "cloud") return "Leash Cloud";
        if (state.clientMode === "custom") return "Personal Open Source";
        return "Personal";
      }

      function modeFootnote() {
        if (state.clientMode === "cloud") return "Leash Cloud syncs your personal rules, approvals, and history across your devices.";
        if (state.clientMode === "custom") {
          if (isLocalOpenSourceApi(state.remoteApiUrl)) {
            return "Personal Open Source uses your local Leash API and Postgres while client updates continue through the public Leash update feed.";
          }
          return "Personal Open Source uses the API endpoint configured on this computer.";
        }
          return "Personal mode protects the agents on this computer.";
      }

      function updateModeFoot() {
        modeFoot.textContent = modeFootnote();
      }

      function modeTag() {
        return `<span class="tag good">${escapeHtml(modeLabel())}</span>`;
      }

      function renderAvailabilityBanner() {
        root.querySelector(".availabilityBanner")?.remove();
        if (state.clientMode !== "cloud" || !state.availability?.degraded) return;
        const banner = document.createElement("section");
        banner.className = "availabilityBanner";
        banner.setAttribute("role", "status");
        banner.innerHTML = `
          <span class="availabilityPulse" aria-hidden="true"></span>
          <span><strong>Cloud protection is temporarily unavailable</strong><small>Your agents keep working in degraded mode while Leash reconnects automatically. Supported actions are not being remotely evaluated right now.</small></span>
          <b>Reconnecting</b>
        `;
        root.prepend(banner);
      }

      function headerIdentityHtml() {
        const remoteUser = state.clientMode === "cloud" ? String(state.remoteUser || "").trim() : "";
        return `<span class="cloudAccount">${modeTag()}${remoteUser ? `<small class="cloudAccountUser" title="${escapeHtml(remoteUser)}">${escapeHtml(remoteUser)}</small>` : ""}</span>`;
      }

      function isSetupLocked() {
        return !state.setupComplete || state.mode === "setup";
      }

      function isSetupSurfaceActive() {
        return isSetupLocked() || setupFinishing || setupInstallState === "complete" || setupInstallState === "failed";
      }

      function isIntroLocked() {
        return !state.introSeen;
      }

      function renderIntro() {
        introPlaying = true;
        document.body.classList.add("intro-active");
        root.innerHTML = `
          <section class="introScreen">
            <video id="introVideo" autoplay muted playsinline preload="auto" src="openleash-video.mp4"></video>
            <button class="secondary introSkip" id="skipIntro">Skip</button>
          </section>
        `;
        const video = document.getElementById("introVideo");
        const finish = () => finishIntro();
        document.getElementById("skipIntro").onclick = finish;
        video.onended = finish;
        video.onerror = finish;
        video.play?.().catch(() => undefined);
      }

      async function finishIntro() {
        if (state.introSeen) return;
        introPlaying = false;
        state.introSeen = true;
        document.body.classList.remove("intro-active");
        await window.openleash.markIntroSeen?.();
        if (isSetupLocked()) renderSetup();
        else renderView();
      }

      /* setup-install-progress:start */
      function setupAgentFill(percent, index, total) {
        if (total <= 0) return 100;
        return Math.max(0, Math.min(100, (Math.max(0, Math.min(100, percent)) / 100 * total - index) * 100));
      }
      /* setup-install-progress:end */

      function selectedSetupAgentCatalog() {
        const catalog = [
          { kind: "claude-code", displayName: "Claude Code", icon: "claude.png" },
          { kind: "github-copilot", displayName: "GitHub Copilot", icon: "githubcopilot.svg" },
          { kind: "gemini", displayName: "Gemini CLI", icon: "googlegemini.svg" },
          { kind: "opencode", displayName: "OpenCode", icon: "opencode.png" },
          { kind: "codex", displayName: "OpenAI Codex", icon: "codex.png" },
          { kind: "cline", displayName: "Cline", icon: "cline.png" },
          { kind: "cursor", displayName: "Cursor", icon: "cursor.png" },
          { kind: "windsurf", displayName: "Windsurf", icon: "windsurf.svg" }
        ];
        const selected = selectedAgents || new Set();
        return catalog.filter((agent) => selected.has(agent.kind));
      }

      function setupInstallMark(status) {
        if (status === "complete") {
          return `<div class="setupInstallMark complete"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m8 16 5 5L24 10" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
        }
        if (status === "failed") {
          return `<div class="setupInstallMark error"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 9v8m0 5h.01" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="16" cy="16" r="11" stroke="currentColor" stroke-width="2.5"/></svg></div>`;
        }
        return `<div class="setupInstallMark"><svg viewBox="0 0 34 34" fill="none" aria-hidden="true"><path d="M8 8c0 4.4 3.6 8 8 8s8-3.6 8-8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M8 17c0 4.4 3.6 8 8 8s8-3.6 8-8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><circle cx="26" cy="8" r="3" fill="currentColor"/></svg></div>`;
      }

      function setupInstallStageClass(percent, threshold, nextThreshold, status) {
        if (status === "complete" || percent >= nextThreshold) return "done";
        if (percent >= threshold && status !== "failed") return "active";
        return "";
      }

      function renderSetupInstallation() {
        stopWelcomeAgentAnimation();
        const status = setupInstallState === "complete" ? "complete" : setupInstallState === "failed" ? "failed" : "installing";
        const percent = status === "complete" ? 100 : Math.max(2, Math.min(99, Number(setupInstallProgress.percent || 0)));
        const agents = selectedSetupAgentCatalog();
        const title = status === "complete" ? "Leash is installed" : status === "failed" ? "Installation needs attention" : "Installing Leash";
        const detail = status === "complete"
          ? "Your selected agents are protected. Continue to Leash to see them working."
          : status === "failed"
            ? "Nothing is hidden. Review the issue below, then retry or adjust your setup."
            : setupInstallProgress.detail || "Applying protection to this Mac...";
        root.innerHTML = `
          <section class="setupInstallScreen">
            <div class="setupInstallCard">
              ${setupInstallMark(status)}
              <div class="setupInstallCopy">
                <h1>${escapeHtml(title)}</h1>
                <p>${escapeHtml(detail)}</p>
              </div>
              ${agents.length ? `
                <div class="setupInstallAgents" aria-label="Selected agents">
                  ${agents.map((agent, index) => {
                    const fill = status === "complete" ? 100 : setupAgentFill(percent, index, agents.length);
                    const src = `agents/${escapeHtml(agentIconFile(agent.icon))}`;
                    return `
                      <div class="setupInstallAgent">
                        <span class="setupInstallAgentIcon" style="--unfilled:${100 - fill}%">
                          <img class="gray" src="${src}" alt="">
                          <img class="color" src="${src}" alt="">
                        </span>
                        <small>${escapeHtml(agent.displayName)}</small>
                      </div>
                    `;
                  }).join("")}
                </div>
              ` : ""}
              <div class="setupInstallMeter">
                <div class="setupInstallMeterTrack"><div class="setupInstallMeterFill" style="width:${percent}%"></div></div>
                <div class="setupInstallMeterMeta">
                  <span>${escapeHtml(status === "complete" ? "Protection active" : status === "failed" ? "Installation paused" : setupInstallProgress.title || "Installing")}</span>
                  <span>${status === "failed" ? "—" : `${Math.round(percent)}%`}</span>
                </div>
              </div>
              <div class="setupInstallStages" aria-label="Installation stages">
                <span class="setupInstallStage ${setupInstallStageClass(percent, 0, 20, status)}">Prepare</span>
                <span class="setupInstallStage ${setupInstallStageClass(percent, 20, 45, status)}">Connect</span>
                <span class="setupInstallStage ${setupInstallStageClass(percent, 45, 78, status)}">Protect agents</span>
                <span class="setupInstallStage ${setupInstallStageClass(percent, 78, 101, status)}">Verify</span>
              </div>
              ${status === "failed" ? `<div class="setupInstallError">${escapeHtml(setupFinishError || "Setup could not be completed.")}</div>` : ""}
              ${status === "complete" ? `<div class="actions"><button class="primary" id="finishInstallContinue">Continue</button></div>` : ""}
              ${status === "failed" ? `<div class="actions"><button class="secondary" id="reviewInstall">Review setup</button><button class="primary" id="retryInstall">Try again</button></div>` : ""}
            </div>
          </section>
        `;
        const continueButton = document.getElementById("finishInstallContinue");
        if (continueButton) continueButton.onclick = () => {
          setupInstallState = "idle";
          view = "overview";
          render(state);
        };
        const reviewButton = document.getElementById("reviewInstall");
        if (reviewButton) reviewButton.onclick = () => {
          setupInstallState = "idle";
          renderSetup();
          scrollSetupTop();
        };
        const retryButton = document.getElementById("retryInstall");
        if (retryButton) retryButton.onclick = () => {
          setupInstallState = "idle";
          void finishSetup();
        };
      }

      function renderSetup() {
        if (setupFinishing || setupInstallState === "complete" || setupInstallState === "failed") {
          renderSetupInstallation();
          return;
        }
        enforceAudienceMode();
        const cloud = setupClientMode === "cloud";
        const individualCloud = setupAudience === "individual" && cloud;
        const individualOpenSource = setupAudience === "individual" && setupClientMode === "custom";
        const orgCloud = setupAudience === "organization" && cloud;
        initializePluginSetupState();
        const pluginSteps = [
          { id: "island", title: "Island", subtitle: "Choose whether Leash should show the desktop Island." },
          { id: "features", title: "Your protection", subtitle: "Meet the built-in Features Leash turns on automatically." }
        ];
        const steps = individualOpenSource
          ? [
              { title: "Account", subtitle: "Choose Personal or Business." },
              { title: "Connect", subtitle: "Pick how Leash runs." },
              { title: "Local backend", subtitle: "Start your open-source backend." },
              { title: "AI provider", subtitle: "Connect the AI Leash will use for safety checks." },
              { title: "Agents", subtitle: "Choose agents to protect." },
              ...pluginSteps
            ]
          : individualCloud
            ? [
                { title: "Account", subtitle: "Choose Personal or Business." },
                { title: "Connect", subtitle: "Pick how Leash runs." },
                { title: "Sign in", subtitle: "Sign in to Leash Cloud." },
                { title: "Agents", subtitle: "Choose agents to protect." },
                ...pluginSteps
              ]
            : [
                { title: "Account", subtitle: "Choose Personal or Business." },
                { title: "Connect", subtitle: "Connect this computer to Leash Business." },
                { title: "Sign in", subtitle: "Sign in to Leash Business." },
                { title: "Agents", subtitle: "Choose agents to protect." },
                ...pluginSteps
              ];
        const current = steps[Math.max(0, setupStep - 1)] || steps[0];
        const currentId = current.id || current.title.toLowerCase();
        const progress = Math.round((Math.max(1, setupStep) / steps.length) * 100);
        if (setupStep === 0) {
          if (root.querySelector(".welcomeHero")) {
            bindWelcomeNext();
            if (!welcomeAgentAnimation) startWelcomeAgentAnimation();
            return;
          }
          root.innerHTML = `
            <section class="welcomeHero">
              <div class="welcomeAgents" aria-hidden="true">
                ${welcomeAgentSprites()}
              </div>
              <div class="welcomeMark">
                <svg viewBox="0 0 34 34" fill="none" aria-hidden="true">
                  <path d="M8 8c0 4.4 3.6 8 8 8s8-3.6 8-8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
                  <path d="M8 17c0 4.4 3.6 8 8 8s8-3.6 8-8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity=".55" />
                  <circle cx="26" cy="8" r="3" fill="currentColor" />
                </svg>
              </div>
              <div class="welcomeCopy">
                <div class="welcomeKicker">Control your agents</div>
                <h1>Leash</h1>
                <p>Leash Desktop detects the AI agents on this computer and helps you protect them.</p>
              </div>
              <div class="welcomeTiles">
                <div class="welcomeTile"><strong>See what they do</strong><p>Track agent commands, files, connected tools, usage, and history.</p></div>
                <div class="welcomeTile"><strong>Control risky actions</strong><p>Approve risky changes to your files, code, databases, settings, and private data.</p></div>
                <div class="welcomeTile"><strong>Mobile approvals are coming soon</strong><p>Review agent decisions from your phone when you are away from your computer.</p></div>
              </div>
              <div class="welcomeActions">
                <button class="primary" id="setupNext">Next</button>
                <span class="welcomeFootnote">Use Leash Cloud or your own personal open-source backend.</span>
              </div>
            </section>
          `;
          bindWelcomeNext();
          startWelcomeAgentAnimation();
          return;
        }
        stopWelcomeAgentAnimation();
        root.innerHTML = `
          <div class="head">
            <div>
              <h1>Set up Leash</h1>
              ${setupGreeting() ? `<div class="setupGreeting">${escapeHtml(setupGreeting())}</div>` : ""}
              <p>${escapeHtml(current.subtitle)}</p>
            </div>
          </div>
          <div class="setupProgress">
            <div class="setupProgressMeta">
              <span>Step ${setupStep} of ${steps.length}</span>
              <span>${escapeHtml(current.title)}</span>
            </div>
            <div class="setupProgressBar"><div class="setupProgressFill" style="width:${progress}%"></div></div>
          </div>
          <div class="setupStack">
            ${currentId === "account" ? `
              <section class="setupSection">
                <h2>Who will use Leash?</h2>
                <p>This changes the account and setup options you see next.</p>
                <div class="cardList">
                  ${audienceChoice("individual", "Personal", "Protect the AI agents you use yourself.")}
                  ${audienceChoice("organization", "Business", "Protect your team with shared security and control.")}
                </div>
              </section>
            ` : ""}
            ${currentId === "connect" ? `
              <section class="setupSection">
                <h2>Connection</h2>
                <p>${orgCloud ? "Leash Business uses Leash Cloud so your team stays connected and protected." : "Pick how Leash runs for you."}</p>
                <div class="cardList">
                  ${connectionChoice("cloud", orgCloud ? "Leash Business Cloud" : "Leash Cloud", orgCloud ? "Connect this computer to your company account, policies, and shared history." : "Use your Leash-hosted personal account and sync.", "cloud")}
                  ${setupAudience === "individual" ? connectionChoice("custom", "Personal Open Source", "Run the open-source API and database on this computer.", "devices") : ""}
                </div>
              </section>
            ` : ""}
            ${currentId === "local backend" ? `
              <section class="setupSection">
                <h2>Local backend</h2>
                <div class="card">
                  <strong>Leash API and Database</strong>
                  <p>Starting the open-source backend and persistent database with Docker.</p>
                  <div class="localBackendProgress">
                    <div class="localBackendProgressBar"><div class="localBackendProgressFill ${setupDockerStatus?.apiReachable ? "ready" : setupDockerBusy ? "busy" : ""}"></div></div>
                    <div class="localBackendStatus">${escapeHtml(setupDockerStatus?.apiReachable ? "Setup finished. Local Leash is ready." : setupDockerBusy ? "Starting local Leash..." : setupDockerStatus?.status || "Preparing local services...")}</div>
                  </div>
                  ${!setupDockerBusy && !setupDockerStatus?.apiReachable && setupDockerStatus?.status ? `<div class="actions left" style="margin-top:16px"><button class="primary" id="startLocalBackend">Retry</button><button class="secondary" id="checkDockerStatus">Check Docker</button></div>` : ""}
                  <div class="notice" style="margin-top:12px">${escapeHtml(setupDockerStatus?.apiReachable ? "You can continue." : setupDockerStatus?.status || "Your data is stored in a local Docker volume.")}</div>
                  ${setupRemoteError ? `<div class="error">${escapeHtml(setupRemoteError)}</div>` : ""}
                </div>
              </section>
            ` : ""}
            ${currentId === "api" ? `
              <section class="setupSection">
                <h2>API configuration</h2>
                <div class="card">
                  <strong>Managed API</strong>
                  <p>Your personal Leash API endpoint.</p>
                  <div class="fieldRow" style="margin-top:14px">
                    <strong>API URL</strong>
                    <input id="remoteApiUrl" value="${escapeHtml(setupRemoteApiUrl === (state.cloudApiUrl || "https://api.openleash.com") ? "" : setupRemoteApiUrl)}" placeholder="https://openleash.your-company.com">
                  </div>
                  <div id="remoteSetupError" class="error">${escapeHtml(setupRemoteError)}</div>
                </div>
              </section>
            ` : ""}
            ${currentId === "sign in" ? `
              <section class="setupSection">
                <h2>Sign in</h2>
                <div class="card">
                  ${setupRemoteAuth ? `
                    <div class="authSummary">
                      <div>
                        <strong>${escapeHtml(setupRemoteAuth.userName || setupRemoteAuth.userEmail || "Signed in")}</strong>
                        ${setupRemoteAuthSubtitle() ? `<small>${escapeHtml(setupRemoteAuthSubtitle())}</small>` : ""}
                      </div>
                      <span class="tag good">Connected</span>
                    </div>
                  ` : `
                    <strong>${orgCloud ? "Continue with your work account" : setupClientMode === "cloud" ? "Continue with Google or GitHub" : "Connect to your personal API"}</strong>
                    <p>${orgCloud ? "Sign in to Leash Business. Your company setup and controls stay in the Business dashboard." : setupClientMode === "cloud" ? "Create or access your personal Leash Cloud account here." : "Personal Open Source is bootstrapped locally without a cloud sign-in."}</p>
                    <div class="actions left" style="margin-top:16px">
                      ${orgCloud && state.cloudDevAuth ? `
                        <button class="googleSignIn" id="orgCloudGoogle" ${setupRemoteBusy ? "disabled" : ""}>
                          <span style="font-weight:900;color:#111827">DEV</span>
                          <span>${setupRemoteBusy ? "Opening..." : `Continue as ${escapeHtml(state.cloudDevAuthEmail || "mobile.user@openleash.com")}`}</span>
                        </button>
                      ` : orgCloud ? `
                        <button class="googleSignIn" id="orgCloudGoogle" ${setupRemoteBusy ? "disabled" : ""}>
                          <svg viewBox="0 0 18 18" aria-hidden="true">
                            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
                            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.33-1.58-5.04-3.71H.94v2.33A9 9 0 0 0 9 18z"/>
                            <path fill="#FBBC05" d="M3.96 10.71a5.41 5.41 0 0 1 0-3.42V4.96H.94a9 9 0 0 0 0 8.08l3.02-2.33z"/>
                            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .94 4.96l3.02 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
                          </svg>

        const audience = root.querySelector("[name=setupAudience]:checked");

          input.checked ? selectedAgents.add(input.dataset.agent) : selectedAgents.delete(input.dataset.agent);
        });
        root.querySelectorAll("[data-rule]").forEach((input) => {
          if (!selectedRules) selectedRules = new Map();
          selectedRules.set(input.dataset.rule, Boolean(input.checked));
        });
        root.querySelectorAll("[data-plugin-install]").forEach((input) => {
          if (!selectedPlugins) selectedPlugins = new Set();
          input.checked ? selectedPlugins.add(input.dataset.pluginInstall) : selectedPlugins.delete(input.dataset.pluginInstall);
          ensurePluginSetupConfig(input.dataset.pluginInstall).enabled = Boolean(input.checked);
        });
        (state.plugins || []).forEach((plugin) => {
          if (plugin.organizationPolicy?.mandatory) {
            if (!selectedPlugins) selectedPlugins = new Set();
            selectedPlugins.add(plugin.id);
            ensurePluginSetupConfig(plugin.id).enabled = true;
          }
        });
        root.querySelectorAll("[data-plugin-setting]").forEach((input) => {
          updatePluginSettingFromInput(input);
        });
        const provider = root.querySelector("[name=provider]:checked");
        if (provider) setupProvider = provider.value;
        const providerSelect = document.getElementById("apiProvider");
        if (providerSelect) setupProvider = providerSelect.value;
        const evaluationPackage = root.querySelector("[name=evaluationPackage]:checked");
        if (evaluationPackage) setupRemotePackage = evaluationPackage.value;
        const key = document.getElementById("apiKey");
        if (key) setupApiKey = key.value.trim();
        const island = root.querySelector("[name=setupIsland]:checked");
        if (island) setupIslandEnabled = island.value === "on";

      async function finishSetup() {
        if (setupFinishing) return;
        rememberSetupInputs();
        setupFinishError = "";
        if (setupClientMode === "cloud" && setupAudience === "organization" && isPersonalEmail(setupRemoteAuth?.userEmail)) {
          setupRemoteError = "Use your company Google Workspace or Microsoft 365 account, not a personal email address.";
          setupRemoteAuth = undefined;
          setupStep = setupClientMode === "custom" ? 4 : 3;
          renderSetup();
          return;
        }
        setupFinishing = true;
        setupInstallState = "installing";
        setupInstallProgress = { percent: 4, stage: "prepare", title: "Preparing installation", detail: "Checking your connection and selected protection..." };
        setupFinishError = "";
        renderSetup();
        if (setupAudience === "individual" && setupClientMode === "custom") {
          setupRemoteApiUrl = "http://127.0.0.1:9318";
          if (!setupDockerStatus?.apiReachable) {
            setupInstallProgress = { percent: 8, stage: "connect", title: "Starting your local backend", detail: "Starting Leash API and Postgres with Docker..." };
            renderSetup();
            await startSelfHostedRuntime();
          }
          if (!setupDockerStatus?.apiReachable) {
            setupFinishing = false;
            setupInstallState = "failed";
            setupFinishError = setupDockerStatus?.status || "Start the local Leash backend before finishing setup.";
            setupRemoteNotice = "";
            renderSetup();
            return;
          }
        }
        enableEverySetupFeature();
        setupInstallProgress = { percent: 12, stage: "prepare", title: "Turning on every Feature", detail: "Activating every built-in protection and cost control..." };
        renderSetup();
        const agents = [...(selectedAgents || new Set())];
        const pluginSave = await saveSelectedPluginSettings();
        if (!pluginSave.ok) {
          setupFinishing = false;
          setupInstallState = "failed";
          setupFinishError = pluginSave.error || "Could not save Feature settings.";
          setupRemoteNotice = "";
          renderSetup();
          return;
        }
        setupInstallProgress = { percent: 16, stage: "prepare", title: "Preparing this Mac", detail: "Connecting Leash to the selected agents..." };
        renderSetup();
        const rules = (state.rules || []).map((rule) => ({
          ...rule,
          enabled: rule.locked ? true : (selectedRules?.get(rule.id) ?? Boolean(rule.enabled))
        }));
        const result = await window.openleash.setup({
          agents,
          policies: rules,
          audience: setupAudience,
          clientMode: setupClientMode,
          apiProvider: setupProvider,
          apiKey: setupApiKey,
          remoteApiUrl: setupRemoteApiUrl,
          remoteToken: setupRemoteAuth?.token,
          remoteOrganization: setupRemoteAuth?.organizationName || setupRemoteAuth?.organizationSlug,
          remoteUser: setupRemoteAuth?.userName || setupRemoteAuth?.userEmail,
          skipDashboardOpen: setupSkipDashboardOpenAfterInstall,
          islandVisibility: setupIslandEnabled ? "always" : "off"
        }).catch((error) => ({ ok: false, error: error?.message || "Setup could not be completed." }));
        if (result && result.ok === false) {
          setupFinishing = false;
          setupInstallState = "failed";
          setupFinishError = result.error || "Setup could not be completed.";
          renderSetup();
        } else if (result?.ok) {
          setupFinishing = false;
          setupInstallState = "complete";
          setupInstallProgress = { percent: 100, stage: "complete", title: "Protection active", detail: "Leash is ready." };
          state = { ...state, ...result, setupComplete: true, mode: result.mode || "settings" };
          view = "overview";
          renderSetup();
        }
      }

      function startWelcomeAgentAnimation() {
        stopWelcomeAgentAnimation();
        const box = root.querySelector(".welcomeAgents");
        if (!box) return;
        const icons = [...box.querySelectorAll(".welcomeAgentIcon")].map((node) => ({
          node,
          x: Number(node.dataset.x || 0),
          y: Number(node.dataset.y || 0),
          vx: Number(node.dataset.vx || 0),
          vy: Number(node.dataset.vy || 0),
          r: Number(node.dataset.r || 0),
          vr: Number(node.dataset.vr || 0)
        }));
        let last = performance.now();
        const tick = (now) => {
          const delta = Math.min(34, now - last);
          last = now;
          const width = box.clientWidth;
          const height = box.clientHeight;
          for (const icon of icons) {
            const size = icon.node.offsetWidth || 34;
            icon.x += icon.vx * delta;
            icon.y += icon.vy * delta;
            icon.r += icon.vr * delta;
            if (icon.x <= 0 || icon.x >= width - size) {
              icon.x = Math.max(0, Math.min(width - size, icon.x));
              icon.vx *= -1;
              varyWelcomeAgentVelocity(icon);
            }
            if (icon.y <= 0 || icon.y >= height - size) {
              icon.y = Math.max(0, Math.min(height - size, icon.y));
              icon.vy *= -1;
              varyWelcomeAgentVelocity(icon);
            }
            icon.node.style.transform = `translate3d(${icon.x}px, ${icon.y}px, 0) rotate(${icon.r}deg)`;
          }
          welcomeAgentAnimation = requestAnimationFrame(tick);
        };
        welcomeAgentAnimation = requestAnimationFrame(tick);
      }

      function varyWelcomeAgentVelocity(icon) {
        const speed = Math.hypot(icon.vx, icon.vy) || .1;
        const angle = Math.atan2(icon.vy, icon.vx) + (Math.random() - .5) * .42;
        const nextSpeed = Math.max(.055, Math.min(.14, speed * (.92 + Math.random() * .16)));
        icon.vx = Math.cos(angle) * nextSpeed;
        icon.vy = Math.sin(angle) * nextSpeed;
        icon.vr = (Math.random() - .5) * .018;
      }

      function stopWelcomeAgentAnimation() {
        if (!welcomeAgentAnimation) return;
        cancelAnimationFrame(welcomeAgentAnimation);
        welcomeAgentAnimation = 0;
      }

        if (setupAudience === "organization") setupClientMode = "cloud";

        root.querySelectorAll("[name=setupAudience]").forEach((input) => {
          input.onchange = () => {
            setupAudience = input.value;
            enforceAudienceMode();

            setupRemoteBootstrap = undefined;
            setupRemoteError = "";
            setupRemoteNotice = "";
            setupDockerAutoStarted = false;
            renderSetup();
          };

      function bindConnectionSelection() {
        root.querySelectorAll("[name=clientMode]").forEach((input) => {
          input.onchange = () => {
            setupConnectionTouched = true;
            setupClientMode = input.value;
            if (setupClientMode === "cloud") {
              setupRemoteApiUrl = state.cloudApiUrl || "https://api.openleash.com";
              setupOrganizationSlug = "";
            } else if (setupAudience === "individual" && setupClientMode === "custom") {
              setupRemoteApiUrl = "http://127.0.0.1:9318";
              setupOrganizationSlug = "";
            } else if (setupClientMode === "custom" && setupRemoteApiUrl === (state.cloudApiUrl || "https://api.openleash.com")) {
              setupRemoteApiUrl = "";
            }
            setupRemoteAuth = undefined;
            setupRemoteBootstrap = undefined;
            setupRemoteError = "";
            setupRemoteNotice = "";
            setupDockerAutoStarted = false;
            renderSetup();
          };
        });
        const remoteApi = document.getElementById("remoteApiUrl");
        if (remoteApi) remoteApi.oninput = () => {
          setupConnectionTouched = true;
          setupRemoteApiUrl = remoteApi.value.trim();
          setupRemoteAuth = undefined;
          setupRemoteNotice = "";
        };
        const slug = document.getElementById("organizationSlug");
        if (slug) slug.oninput = () => {
          setupOrganizationSlug = slug.value.trim();
          setupRemoteAuth = undefined;
          setupRemoteNotice = "";
        };

      async function bootstrapRemoteSetup() {
        setupRemoteError = "";
        if (!setupRemoteApiUrl) {
          setupRemoteError = "Add the API URL to continue.";
          return false;
        }
        if (setupClientMode === "custom" && !setupOrganizationSlug) {
          setupOrganizationSlug = "";
        }
        const result = await window.openleash.bootstrapRemoteApi({
          apiUrl: setupRemoteApiUrl,
          organizationSlug: setupOrganizationSlug
        }).catch((error) => ({
          ok: false,
          error: error?.message || "Could not reach that Leash API."
        }));
        if (!result?.ok) {
          setupRemoteError = result?.error || "Could not reach that Leash API.";
          return false;
        }
        setupRemoteBootstrap = result;
        setupRemoteApiUrl = result.apiUrl || setupRemoteApiUrl;
        return true;
      }

      async function startRemoteSignIn(providerOverride) {
        rememberSetupInputs();
        setupRemoteProvider = providerOverride || setupRemoteProvider || "google";
        setupRemoteBusy = true;
        setupRemoteError = "";
        setupRemoteNotice = "";
        renderSetup();
        const ok = setupRemoteBootstrap ? true : await bootstrapRemoteSetup();
        if (!ok) {
          setupRemoteBusy = false;
          return renderSetup();
        }
        const provider = setupClientMode === "cloud"
          ? { type: setupRemoteProvider }
          : (setupRemoteBootstrap.providers || [])[0] || { type: "sso" };
        const organization = setupAudience === "organization" ? setupRemoteBootstrap.organization || {} : {};
        const result = await window.openleash.startRemoteAuth({
          apiUrl: setupRemoteApiUrl,
          audience: setupAudience,
          providerType: provider.type || provider.providerType || "google",
          organizationId: setupAudience === "organization" ? organization.id : undefined,
          organizationSlug: setupAudience === "organization" ? setupOrganizationSlug || organization.slug : undefined
        }).catch((error) => ({
          ok: false,
          error: error?.message || "Could not start sign-in."
        }));
        setupRemoteBusy = false;
        if (!result?.ok) {
          setupRemoteError = result?.error || "Could not start sign-in.";
          renderSetup();
        } else {
          setupRemoteNotice = "Complete sign-in in your browser.";
          renderSetup();
        }
      }

      function setupRemoteAuthSubtitle() {
        if (!setupRemoteAuth) return "";
        if (setupAudience === "individual") return "";
        return setupRemoteAuth.organizationName || setupRemoteAuth.organizationSlug || setupRemoteApiUrl;
      }

      function setupGreeting() {
        if (!setupRemoteAuth) return "";
        const label = setupRemoteAuth.userName || setupRemoteAuth.userEmail || "";
        if (!label) return "";
        return `Hi, ${label}`;

      function isLocalOpenSourceApi(value) {
        try {
          const url = new URL(value || "");
          return ["localhost", "127.0.0.1", "::1"].includes(url.hostname);

          return false;
        }

      function scrollSetupTop() {
        const main = document.querySelector("main");

        main.scrollTop = 0;

      async function loadManagedRules() {
        if (!setupRemoteAuth?.token || setupClientMode === "personal") return;
        const result = await window.openleash.remoteState({
          apiUrl: setupRemoteApiUrl,
          token: setupRemoteAuth.token
        }).catch(() => undefined);
        if (!result?.ok) return;
        if (Array.isArray(result.policies)) {
          state.rules = result.policies.map((policy) => ({
            id: policy.id,
            name: policy.name,
            category: categoryForManagedRule(policy),
            description: policy.description || policy.natural_language_rule || "Managed Leash rule.",
            enabled: Boolean(policy.enabled || policy.locked),
            locked: Boolean(policy.locked),
            managedByOrganization: Boolean(policy.managedByOrganization || policy.managed_by_organization)
          }));
          selectedRules = new Map((state.rules || []).map((rule) => [rule.id, rule.locked ? true : Boolean(rule.enabled)]));
        }
        if (Array.isArray(result.plugins)) {
          state.plugins = result.plugins;
          initializePluginSetupState(true);
        }
      }

      function shouldAutoFinishAfterRemoteAuth() {
        return setupClientMode === "cloud" && setupAudience === "organization";
      }

      function categoryForManagedRule(policy) {
        const text = `${policy.name || ""} ${policy.description || ""} ${policy.natural_language_rule || ""}`.toLowerCase();
        if (/credential|secret|token|personal|private key|\.env/.test(text)) return "Security";
        if (/git|branch|commit|push|history/.test(text)) return "Git";
        if (/package|dependency|lockfile|npm|pip|yarn|pnpm/.test(text)) return "Packages";
        if (/cloud|terraform|kubernetes|infrastructure|filesystem|delete/.test(text)) return "Infrastructure";
        if (/database|external|upload|sharing|exfiltrat/.test(text)) return "Data";
        return "Managed rules";
      }

      function installedPlugins() {
        return (state.plugins || []).filter(pluginInstalled);
      }

      function availablePlugins() {
        return (state.plugins || []).filter((plugin) => !pluginInstalled(plugin));
      }

      function pluginInstalled(plugin) {
        return Boolean(
          plugin?.organizationPolicy?.mandatory ||
          plugin?.installed === true ||
          plugin?.settings?.enabled === true ||
          [...(plugin?.settings?.inheritedProfiles || []), ...(plugin?.settings?.profiles || [])]
            .some((profile) => profile.enabled === true)
        );
      }

      function pluginStatusLabel(plugin) {
        if (plugin?.settings?.runtimeAvailable === false) return "unavailable";
        if (plugin?.organizationPolicy?.mandatory) return "required";
        return pluginInstalled(plugin) ? "enabled" : "off";

      function clientPluginCategories() {

          return { id, label, plugins: items, count: items.length };

          defaultConfig: pluginView?.defaultConfig,
          configSchema: pluginView?.configSchema,

      function overviewActivitySummary(inventory) {
        const remote = state.activitySummary;
        if (remote?.totals && Array.isArray(remote.threats) && Array.isArray(remote.agentKinds)) {
          return {
            rangeDays: Math.max(1, Number(remote.rangeDays) || 30),
            totals: {
              checked: Math.max(0, Number(remote.totals.checked) || 0),
              blocked: Math.max(0, Number(remote.totals.blocked) || 0),
              automaticallyApproved: Math.max(0, Number(remote.totals.automaticallyApproved) || 0),
              manuallyApproved: Math.max(0, Number(remote.totals.manuallyApproved) || 0),
              waiting: Math.max(0, Number(remote.totals.waiting) || 0)
            },
            threats: remote.threats.map((item) => ({
              name: String(item.name || "Other threats"),
              total: Math.max(0, Number(item.total) || 0),
              blocked: Math.max(0, Number(item.blocked) || 0),
              automaticallyApproved: Math.max(0, Number(item.automaticallyApproved) || 0),
              manuallyApproved: Math.max(0, Number(item.manuallyApproved) || 0)
            })).slice(0, 8),
            agentKinds: remote.agentKinds.map((item) => ({
              kind: String(item.kind || "unknown"),
              name: String(item.name || item.kind || "AI agent"),
              count: Math.max(0, Number(item.count) || 0)
            })).filter((item) => item.count > 0)
          };
        }

        const history = Array.isArray(state.history) ? state.history : [];
        const totals = { checked: history.length, blocked: 0, automaticallyApproved: 0, manuallyApproved: 0, waiting: 0 };
        const threats = new Map();
        for (const item of history) {
          const decision = String(item.decision || "").toLowerCase();
          const resolution = String(item.resolution || "").toLowerCase();
          const learningModeApproval = resolution === "allow" && item.resolved_by === "organization-learning-mode";
          const blocked = resolution === "deny" || decision === "deny" || decision === "blocked";
          const automatic = decision === "allow" || learningModeApproval;
          const manual = decision === "ask" && resolution === "allow" && !learningModeApproval;
          const waiting = decision === "ask" && !resolution;
          if (blocked) totals.blocked += 1;
          if (automatic) totals.automaticallyApproved += 1;
          if (manual) totals.manuallyApproved += 1;
          if (waiting) totals.waiting += 1;
          const names = new Set((item.triggered_policies || []).map((policy) => String(policy.category || policy.policy_name || "Other threats").trim()).filter(Boolean));
          for (const name of names) {
            const threat = threats.get(name) || { name, total: 0, blocked: 0, automaticallyApproved: 0, manuallyApproved: 0 };
            threat.total += 1;
            if (blocked) threat.blocked += 1;
            if (automatic) threat.automaticallyApproved += 1;
            if (manual) threat.manuallyApproved += 1;
            threats.set(name, threat);
          }
        }
        return {
          rangeDays: 30,
          totals,
          threats: [...threats.values()].sort((a, b) => b.total - a.total || a.name.localeCompare(b.name)).slice(0, 8),
          agentKinds: inventory.filter((item) => item.installed).map((item) => ({ kind: item.kind, name: item.displayName, count: 1 }))
        };
      }

                ${summary.threats.length ? `<div class="overviewThreatList">${summary.threats.map((threat) => `

      function overviewDeviceHtml() {
        const platform = String(navigator.platform || navigator.userAgent || "").toLowerCase();

          ? { label: "This iPhone", image: "iphone.png" }
          : platform.includes("android")
            ? { label: "This Android phone", image: "android.png" }
            : platform.includes("win")
              ? { label: "This Windows PC", image: "windows-desktop.png" }
              : { label: "This MacBook", image: "macbook.png" };
        const recent = (state.agents || []).map((agent) => Date.parse(agent.last_seen_at || agent.activity_at || "")).filter(Number.isFinite).sort((a, b) => b - a)[0];
        const ageSeconds = recent ? Math.max(0, Math.floor((Date.now() - recent) / 1000)) : 0;
        const synced = ageSeconds < 60 ? "just now" : ageSeconds < 3600 ? `${Math.floor(ageSeconds / 60)}m ago` : ageSeconds < 86400 ? `${Math.floor(ageSeconds / 3600)}h ago` : `${Math.floor(ageSeconds / 86400)}d ago`;
        return `
          <div class="overviewDevice">
            <span class="overviewDeviceArt" aria-hidden="true"><img src="devices/${device.image}" alt=""></span>
            <span><strong>${device.label}</strong><small>Leash Desktop</small></span>
            <span class="overviewDeviceSync">Synced ${escapeHtml(synced)}</span>
          </div>

      function renderOverview() {
        const inventory = overviewAgentInventory();
        const unread = unreadHistoryItems();
        const activitySummary = overviewActivitySummary(inventory);
        root.innerHTML = `
          <div class="head">
            <div><h1>Overview</h1><p>${unread.length ? `${unread.length} new ${unread.length === 1 ? "update" : "updates"} from your agents.` : "See what your protected AI agents are doing."}</p></div>

      function cloudTrialBannerHtml() {
        if (state.clientMode !== "cloud" || !state.billing) return "";
        const trial = state.billing.trial;
        if (state.billing.upgradeRequired) {
          const href = setupAudience === "organization" ? "https://dashboard.openleash.com/billing" : "https://openleash.com/account";
          return `<div class="card" style="border-color:#ef4444;background:#fff5f5;margin-bottom:18px"><div class="fieldRow"><div><strong>Your Leash Cloud trial ended</strong><p>Upgrade to keep Leash AI protection and Cloud access active.</p></div><a class="secondary" href="${href}" target="_blank" rel="noreferrer" style="text-decoration:none">Upgrade</a></div></div>`;
        }
        if (trial?.active) {
          return `<div class="notice" style="margin-bottom:18px"><strong>Leash Cloud trial · ${escapeHtml(trial.daysRemaining)} day${Number(trial.daysRemaining) === 1 ? "" : "s"} left</strong><br>Leash AI is included. Trial ends ${escapeHtml(formatDateOnly(trial.endsAt))}.</div>`;
        }
        return "";
      }

      function formatDateOnly(value) {
        const date = new Date(value || "");
        return Number.isFinite(date.getTime()) ? date.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }) : "soon";
      }

      function bindAgentMonitoringSwitches(rerender) {
        root.querySelectorAll("[data-overview-agent]").forEach((input) => {
          input.onchange = async () => {
            const next = Boolean(input.checked);
            input.disabled = true;
            const result = await window.openleash.setAgentMonitoring?.({ kind: input.dataset.overviewAgent, monitored: next });
            if (!result?.ok) {
              input.checked = !next;
              state.desktopMessage = result?.error || "Could not update this agent.";
            } else if (Array.isArray(result.localProtections)) {
              state.localProtections = result.localProtections;
            }
            input.disabled = false;
            rerender();
          };
        });
      }

      function historyAgentKind(item) {
        return item.agent_kind || agentKindForName(item.agent_name) || "unknown";
      }

      function unreadHistoryItems() {
        return visibleHistoryItems().filter((item) => {
          const createdAt = Date.parse(item.created_at || item.createdAt || "");
          return Number.isFinite(createdAt)
            && createdAt > notificationBaselineAt
            && !readHistoryIds.has(String(item.id));
        });
      }

      function markHistoryRead(id) {
        if (!id) return;
        readHistoryIds.add(String(id));
        localStorage.setItem("leash-read-history", JSON.stringify([...readHistoryIds].slice(-500)));
      }

      function markAllVisibleHistoryRead() {
        for (const item of visibleHistoryItems()) readHistoryIds.add(String(item.id));
        localStorage.setItem("leash-read-history", JSON.stringify([...readHistoryIds].slice(-500)));
      }

      function notificationCenterHtml() {
        const unread = unreadHistoryItems();
        const items = (unread.length ? unread : visibleHistoryItems()).slice(0, 7);
        return `
          <div class="notificationCenter">
            <button type="button" class="notificationButton" id="notificationButton" aria-label="Notifications${unread.length ? `, ${unread.length} unread` : ""}" aria-expanded="${notificationMenuOpen}">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
              ${unread.length ? `<b>${Math.min(unread.length, 99)}</b>` : ""}
            </button>
            ${notificationMenuOpen ? `
              <div class="notificationMenu">
                <div class="notificationMenuHead"><div><strong>Notifications</strong><small>${unread.length ? `${unread.length} new` : "You are all caught up"}</small></div><button type="button" id="notificationSeeAll">See all</button></div>
                <div class="notificationItems">
                  ${items.map((item) => `
                    <button type="button" class="notificationItem ${readHistoryIds.has(String(item.id)) ? "" : "unread"}" data-notification-event="${escapeHtml(item.id)}">
                      <span class="notificationAgent">${escapeHtml(String(item.agent_name || "AI").slice(0, 1).toUpperCase())}</span>
                      <span><strong>${escapeHtml(displayEventSummary(item))}</strong><small>${escapeHtml(item.agent_name || "AI agent")} · ${escapeHtml(formatTime(item.created_at))}</small></span>
                      ${readHistoryIds.has(String(item.id)) ? "" : "<i></i>"}
                    </button>

                </div>
              </div>

      function bindNotificationCenter() {
        const trigger = document.getElementById("notificationButton");
        if (trigger) trigger.onclick = () => {
          if (!notificationMenuOpen) markAllVisibleHistoryRead();

          renderView();

        const seeAll = document.getElementById("notificationSeeAll");

          renderView();

          item.onclick = () => {
            selectedEventId = item.dataset.notificationEvent;

            selectedAgentHistoryKind = event ? historyAgentKind(event) : "";

            notificationMenuOpen = false;
            view = "event";
            renderView();

      function renderAgentHistory() {
        const inventory = overviewAgentInventory();
        const agent = inventory.find((item) => item.kind === selectedAgentHistoryKind);
        const allHistoryItems = visibleHistoryItems().filter((item) => historyAgentKind(item) === selectedAgentHistoryKind);

        root.innerHTML = `
          <div class="head">
            <div><h1>${escapeHtml(agent?.displayName || "AI agent")}</h1><p>${unreadCount ? `${unreadCount} new ${unreadCount === 1 ? "update" : "updates"}.` : "Everything Leash checked for this agent."}</p></div>

      function renderHistory() {

        root.innerHTML = `
          <div class="head">
